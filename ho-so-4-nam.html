<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Hồ sơ học tập 4 năm ngành Công nghệ Kỹ thuật Ô tô – Hầu Ngọc Minh Tâm, Đại học Lạc Hồng: tài liệu môn học, sản phẩm – đồ án, bài báo – nghiên cứu.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title data-keep>Hồ sơ Ô tô 24OT113</title>
<link data-keep rel="preconnect" href="https://fonts.googleapis.com">
<link data-keep rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link data-keep rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style data-keep>
/* Layout: app shell — sidebar (profile, sections, 4-year progress) + content (hero, filters, entries by year/semester). */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F8FB; --ink:#0E1626; --muted:#5A6478; --line:#E2E6EE;
  --accent:#2457E8; --accent-soft:#E8EEFF; --accent-ink:#FFFFFF;
  --c-docs:#2457E8; --c-docs-soft:#E8EEFF;
  --c-prod:#E5631A; --c-prod-soft:#FDEEE4;
  --c-pap:#0E9468; --c-pap-soft:#E2F5EE;
  --danger:#C62828; --shadow:0 1px 2px rgba(14,22,38,.05),0 4px 16px rgba(14,22,38,.06);
  --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0E15; --surface:#121925; --surface-2:#172031; --ink:#E8ECF4; --muted:#8C97AD; --line:#232D3E;
  --accent:#7097FF; --accent-soft:#1B2847; --accent-ink:#0A0E15;
  --c-docs:#7097FF; --c-docs-soft:#1B2847; --c-prod:#FF8F4F; --c-prod-soft:#3A2416; --c-pap:#3FCB98; --c-pap-soft:#123227;
  --danger:#FF6B6B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E15; --surface:#121925; --surface-2:#172031; --ink:#E8ECF4; --muted:#8C97AD; --line:#232D3E;
  --accent:#7097FF; --accent-soft:#1B2847; --accent-ink:#0A0E15;
  --c-docs:#7097FF; --c-docs-soft:#1B2847; --c-prod:#FF8F4F; --c-prod-soft:#3A2416; --c-pap:#3FCB98; --c-pap-soft:#123227;
  --danger:#FF6B6B; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body,button,input,select,textarea,dialog,option{font-family:var(--font)}
body{background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tot,.stat b{font-variant-numeric:tabular-nums}

/* Shell */
.shell{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--surface) 280px,var(--line) 280px,var(--line) 281px,var(--bg) 281px)}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:24px 16px;background:var(--surface);display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.me{display:flex;gap:12px;align-items:center;padding:0 6px}
.avatar{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--c-pap));color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:none}
.me-name{font-weight:700;font-size:15px;line-height:1.25}
.me-sub{font-size:12.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:4px}
.nav button{appearance:none;border:0;background:none;display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;color:var(--muted);text-align:left;width:100%;white-space:nowrap}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.nav .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--surface-2)}
.nav button[aria-selected="true"] .ico{background:var(--surface)}
.nav .ico svg{width:17px;height:17px}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);padding:1px 8px;border-radius:999px}
.prog{margin-top:auto;padding:14px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.prog-top b{font-size:15px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--c-pap))}
.prog-steps{display:grid;grid-template-columns:repeat(4,1fr);font-size:11.5px;color:var(--muted)}
.prog-steps span.on{color:var(--ink);font-weight:700}

.content{padding-inline:32px;padding-block:28px 110px;min-width:0;max-width:1180px;width:100%}

/* Hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);letter-spacing:.02em;position:relative}
h1{font-size:clamp(26px,3.6vw,38px);font-weight:800;line-height:1.15;margin:6px 0 8px;letter-spacing:-.015em;text-wrap:balance;position:relative}
.intro{color:var(--muted);margin:0;max-width:64ch;position:relative}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;position:relative}
.fact{display:flex;gap:6px;align-items:baseline;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;min-width:0}
.fact .k{color:var(--muted)}
.fact .v{font-weight:600;overflow-wrap:anywhere}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.stat{appearance:none;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--sec)}
.stat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--sec-soft);color:var(--sec);flex:none}
.stat .ico svg{width:22px;height:22px}
.stat b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}

/* Controls */
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search{flex:1 1 220px}
.spacer{flex:1 1 auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.55;cursor:default}

/* Groups */
.group{margin-top:28px}
.group-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.group-head h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-.01em}
.group-head .meta{font-size:13px;color:var(--muted)}
.sem-head{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.sem-head::after{content:"";flex:1;height:1px;background:var(--line)}

/* Row list (docs) */
.register{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .ri{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--sec-soft,var(--c-docs-soft));color:var(--sec,var(--c-docs))}
.row .ri svg{width:19px;height:19px}
.row .course{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.row .t{display:block;font-weight:600}
.row .d{display:block;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sec-soft,var(--c-docs-soft));color:var(--sec,var(--c-docs));white-space:nowrap}
.links-mini{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.lk{font-size:11.5px;font-weight:600;border:1px solid var(--line);padding:2px 8px;border-radius:999px;color:var(--muted)}

/* Cards (products) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--c-prod)}
.cover{aspect-ratio:16/10;max-width:100%;width:100%;object-fit:cover;display:block;background:var(--surface-2)}
.cover.empty{display:grid;place-items:center;color:var(--c-prod);background:linear-gradient(135deg,var(--c-prod-soft),var(--surface-2))}
.cover.empty svg{width:42px;height:42px;opacity:.7}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.card-body .t{font-weight:700;line-height:1.35}
.card-body .d{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* Citations (papers) */
.cite{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 14px 58px;position:relative;cursor:pointer;display:block;width:100%;text-align:left;margin-bottom:10px;box-shadow:var(--shadow)}
.cite:hover{border-color:var(--c-pap)}
.cite .num{position:absolute;left:16px;top:14px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--c-pap-soft);color:var(--c-pap);font-size:13px;font-weight:700}
.cite .t{font-weight:700}
.cite .venue{font-style:italic;color:var(--muted)}

/* Matrix */
.matrix-wrap{overflow-x:auto;margin-top:22px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.matrix{border-collapse:collapse;width:100%;min-width:600px}
.matrix th,.matrix td{border-top:1px solid var(--line);padding:0}
.matrix td+td,.matrix th+td,.matrix th+th{border-left:1px solid var(--line)}
.matrix thead th{border-top:0;font-size:12.5px;font-weight:600;color:var(--muted);padding:12px 14px;text-align:left;background:var(--surface-2)}
.matrix tbody th{text-align:left;padding:14px 16px;vertical-align:top;width:160px}
.matrix tbody th .y{font-size:17px;font-weight:800}
.matrix tbody th .ay{font-size:12.5px;color:var(--muted)}
.mcell{display:flex;flex-direction:column;gap:6px;width:100%;min-height:82px;padding:12px 14px;background:none;border:0;cursor:pointer;text-align:left}
.mcell:hover{background:var(--surface-2)}
.mcell[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.mcell .tot{font-size:22px;font-weight:800;line-height:1}
.mcell .tot.zero{color:var(--line)}
.dots{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.dots span{display:inline-flex;align-items:center;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.now-tag{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:999px;margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%}

.empty-state{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 22px;text-align:center;color:var(--muted);margin-top:18px;background:var(--surface)}
.empty-state h3{font-size:19px;font-weight:800;color:var(--ink);margin:0 0 6px}
.empty-state p{margin:0 auto 14px;max-width:52ch}
.ro-note{font-size:13px;color:var(--muted)}

/* Save bar & toast */
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 12px 10px 18px;border-radius:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.25);width:max-content;max-width:calc(100% - 32px)}
.savebar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.savebar .btn.ghost{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:calc(100% - 32px)}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(700px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,12,20,.55);backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.dlg-head h3{font-size:21px;font-weight:800;line-height:1.25;margin:0;flex:1;text-wrap:balance;min-width:0}
.x{appearance:none;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);flex:none}
.dlg-body{padding:6px 22px 16px;display:flex;flex-direction:column;gap:14px}
.dlg-foot{padding:14px 22px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.spec{display:grid;grid-template-columns:120px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.spec>div{padding:8px 12px;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.spec>div:nth-child(odd){color:var(--muted);background:var(--surface-2);font-size:13px}
.spec>div:nth-last-child(-n+2){border-bottom:0}
.desc{white-space:pre-wrap;margin:0}
.big-cover{width:100%;max-width:100%;border-radius:12px;display:block}
.linklist{display:flex;flex-direction:column;gap:8px}
.linklist a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--ink);min-width:0}
.linklist a:hover{border-color:var(--accent);background:var(--accent-soft)}
.linklist a span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;color:var(--muted);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);padding:2px 10px;border-radius:999px}

/* Form */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.form .field{width:100%;color:var(--ink);font-weight:400;font-size:14.5px}
textarea.field{min-height:96px;resize:vertical}
.link-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) auto;gap:6px;margin-bottom:6px}
.hint{font-weight:400;font-size:12px;color:var(--muted)}
.cover-prev{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cover-prev img{width:128px;aspect-ratio:16/10;object-fit:cover;border-radius:10px}

footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* Responsive */
@media (max-width:900px){
  .shell{grid-template-columns:1fr;background:var(--bg)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:auto;flex-direction:column;gap:10px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
  .me .avatar{width:36px;height:36px;font-size:14px;border-radius:10px}
  .prog{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:2px;margin:0 -16px;padding:0 12px}
  .nav-label{display:none}
  .nav button{width:auto;padding:8px 10px 10px;border-radius:0;border-bottom:2.5px solid transparent;background:none!important}
  .nav button[aria-selected="true"]{border-bottom-color:var(--accent)}
  .nav .ico{display:none}
  .content{padding-inline:16px;padding-block:18px 110px}
  .hero{padding:20px;border-radius:16px}
  .stats{grid-template-columns:1fr;gap:10px}
  .stat{padding:12px 14px}
}
@media (max-width:560px){
  .row{grid-template-columns:36px minmax(0,1fr)}
  .row .links-mini{grid-column:2;justify-content:flex-start}
  .form{grid-template-columns:1fr}
  .spec{grid-template-columns:96px minmax(0,1fr)}
  .link-edit{grid-template-columns:minmax(0,1fr) auto}
  .link-edit [data-ll]{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app" data-keep>
  <div class="shell">
    <aside class="side">
      <div class="me"><div class="avatar" id="avatar">HT</div><div style="min-width:0"><div class="me-name" id="me-name"></div><div class="me-sub" id="me-sub"></div></div></div>
      <nav class="nav" role="tablist" id="nav" aria-label="Các mục"></nav>
      <div class="prog" id="prog"></div>
    </aside>
    <div class="content">
      <header class="hero">
        <div class="eyebrow" id="h-eyebrow">Hồ sơ học tập · Công nghệ Kỹ thuật Ô tô</div>
        <h1 id="h-title">Hồ sơ học tập 4 năm</h1>
        <p class="intro" id="h-intro"></p>
        <div class="facts" id="h-cells"></div>
      </header>
      <div class="controls" id="controls"></div>
      <main id="main"></main>
      <footer><span id="foot-left"></span><span id="foot-right"></span></footer>
    </div>
  </div>
  <dialog id="dlg"></dialog>
  <div class="savebar" id="savebar" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

(function(){

/* ---------- constants ---------- */
const SECTIONS = {
  docs:{label:"Tài liệu môn học", short:"TL", kinds:["Giáo trình","Bài giảng / Slide","Ghi chép","Bài tập","Đề thi / Ôn tập","Thí nghiệm / Thực hành","Khác"]},
  products:{label:"Sản phẩm / Đồ án", short:"SP", kinds:["Đồ án môn học","Mô hình CAD","In 3D","Chế tạo / Lắp ráp","Mô phỏng","Phần mềm / Code","Cuộc thi","Khác"]},
  papers:{label:"Bài báo / Nghiên cứu", short:"BB", kinds:["Bài báo khoa học","Báo cáo","Tiểu luận","Khóa luận / Luận văn","Tổng quan tài liệu","Bằng sáng chế","Khác"]}
};
const SEMS = [["1","HK1"],["2","HK2"],["he","Hè"]];

  docs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>',
  products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></svg>',
  papers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>'
};
const SEC_VAR = {docs:"--sec:var(--c-docs);--sec-soft:var(--c-docs-soft)", products:"--sec:var(--c-prod);--sec-soft:var(--c-prod-soft)", papers:"--sec:var(--c-pap);--sec-soft:var(--c-pap-soft)"};
const initials = n => { const w = String(n||"").trim().split(/\s+/).filter(Boolean); return ((w[0]||"?")[0] + (w.length>1 ? w[w.length-1][0] : "")).toUpperCase(); };


/* ---------- state ---------- */
const st = { view:"overview", year:"all", q:"", course:"all", cell:null, editable:false, dirty:false, saving:false, artifact:null };
try { const v = sessionStorage.getItem("hs-view"); if (v && (v==="overview"||SECTIONS[v])) st.view = v; } catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
const uid = () => "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const P = () => data.profile || {};
const startYear = () => Number(P().startYear) || 2024;
const ayLabel = y => `${startYear()+y-1}–${startYear()+y}`;

function currentPos(){
  const d = new Date(); const m = d.getMonth()+1; let ay = d.getFullYear(); let sem;
  if (m >= 9) sem = "1"; else if (m <= 5){ sem = "2"; ay -= 1; } else { sem = "he"; ay -= 1; }
  const y = ay - startYear() + 1;
  return {y, sem};
}

function linkKind(u){
  const s = u.toLowerCase();
  if (s.includes("drive.google")||s.includes("docs.google")) return "Drive";
  if (s.includes("youtu")) return "Video";
  if (s.includes("github")) return "GitHub";
  if (s.includes("doi.org")) return "DOI";
  if (s.includes("onedrive")||s.includes("sharepoint")) return "OneDrive";
  if (s.endsWith(".pdf")) return "PDF";
  return "Link";
}

/* ---------- filtering ---------- */
function filtered(section){
  const q = st.q.trim().toLowerCase();
  return data.items.filter(it => (!section || it.section === section)
    && (st.year === "all" || String(it.year) === st.year)
    && (st.course === "all" || (it.course||"") === st.course)
    && (!q || [it.title,it.course,it.desc,it.kind,it.authors,it.venue,(it.tags||[]).join(" ")].join(" ").toLowerCase().includes(q)));
}
function sortItems(a,b){ return (a.year-b.year) || (SEM_ORDER[a.sem]-SEM_ORDER[b.sem]) || String(a.course||"").localeCompare(String(b.course||""),"vi") || String(a.date||"").localeCompare(String(b.date||"")); }

/* ---------- header ---------- */
function renderHeader(){
  const p = P();
  $("avatar").textContent = initials(p.name);
  $("me-name").textContent = p.name || "";
  $("me-sub").textContent = [p.lop, p.truong].filter(Boolean).join(" · ");
  $("h-eyebrow").textContent = (p.nganh || "Công nghệ Kỹ thuật Ô tô") + " · " + (p.nienKhoa || "");
  $("h-title").textContent = "Hồ sơ học tập 4 năm";
  $("h-intro").textContent = p.intro || "";
  const facts = [["Sinh viên",p.name],["MSSV",p.mssv],["Lớp",p.lop],["Khoa",p.khoa],["Trường",p.truong]];
  $("h-cells").innerHTML = facts.filter(f=>f[1]).map(([k,v]) => `<span class="fact"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></span>`).join("");
  const now = currentPos(); const total = 12;
  let idx = (now.y-1)*3 + SEM_ORDER[now.sem] + 0.5; idx = Math.max(0, Math.min(total, idx));
  const inRange = now.y>=1 && now.y<=4;
  $("prog").innerHTML = `<div class="prog-top"><span>Tiến độ khóa học</span><b>${inRange?`Năm ${now.y} · ${SEMS.find(s=>s[0]===now.sem)[1]}`:(now.y>4?"Đã hoàn thành":"Chưa bắt đầu")}</b></div>
    <div class="bar"><i style="width:${idx/total*100}%"></i></div>
    <div class="prog-steps">${[1,2,3,4].map(y=>`<span class="${now.y===y?"on":""}">N${y}</span>`).join("")}</div>`;
}

/* ---------- nav & controls ---------- */
function renderNav(){
  const tabs = [["overview","Tổng quan",data.items.length]].concat(Object.entries(SECTIONS).map(([k,s]) => [k,s.label,data.items.filter(i=>i.section===k).length]));
  $("nav").innerHTML = `<div class="nav-label">Danh mục</div>` + tabs.map(([k,l,n]) => `<button role="tab" data-view="${k}" aria-selected="${st.view===k}"><span class="ico">${ICON[k]}</span><span>${esc(l)}</span><span class="cnt">${n}</span></button>`).join("");
}
function renderControls(){
  const yrs = [["all","Cả 4 năm"],["1","Năm 1"],["2","Năm 2"],["3","Năm 3"],["4","Năm 4"]];
  const sec = SECTIONS[st.view] ? st.view : null;
  const courses = [...new Set(data.items.filter(i=>!sec||i.section===sec).map(i=>i.course).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"vi"));
  if (st.course !== "all" && !courses.includes(st.course)) st.course = "all";
  let html = `<div class="chips" role="group" aria-label="Lọc theo năm">${yrs.map(([v,l]) => `<button class="chip" data-year="${v}" aria-pressed="${st.year===v}">${l}</button>`).join("")}</div>`;
  html += `<input class="field search" id="q" type="search" placeholder="Tìm theo tên, môn học, từ khóa…" value="${esc(st.q)}" aria-label="Tìm kiếm">`;
  if (courses.length) html += `<select class="field" id="course" aria-label="Lọc theo môn học"><option value="all">Tất cả môn học</option>${courses.map(c=>`<option ${st.course===c?"selected":""}>${esc(c)}</option>`).join("")}</select>`;
  if (st.editable){
    html += `<span class="spacer"></span><button class="btn" id="edit-profile">Sửa thông tin</button><button class="btn primary" id="add">+ Thêm mục</button>`;
  }
  const c = $("controls"); const hadFocus = document.activeElement && document.activeElement.id === "q";
  const caret = hadFocus ? document.activeElement.selectionStart : null;
  c.innerHTML = html;
  if (hadFocus){ const q=$("q"); q.focus(); try{ q.setSelectionRange(caret,caret);}catch(e){} }
}

/* ---------- item renderers ---------- */
function miniLinks(it){
  const ls = (it.links||[]).filter(l=>safeUrl(l.url));
  if (!ls.length) return "";
  const kinds = [...new Set(ls.map(l=>linkKind(l.url)))];
  return kinds.map(k=>`<span class="lk">${k}</span>`).join("");
}
function rowDoc(it){
  return `<button class="row" data-open="${esc(it.id)}" style="${SEC_VAR[it.section]||""}">
    <span class="ri">${ICON[it.section]||ICON.docs}</span>
    <span style="min-width:0"><span class="course">${esc(it.course||"Chưa gắn môn")}</span><span class="t">${esc(it.title)}</span>${it.desc?`<span class="d">${esc(it.desc)}</span>`:""}</span>
    <span class="links-mini">${it.kind?`<span class="kind">${esc(it.kind)}</span>`:""}${miniLinks(it)}</span>
  </button>`;
}
function cardProduct(it){
  const cover = it.cover ? `<img class="cover" src="${esc(it.cover)}" alt="${esc(it.title)}" loading="lazy">` : `<div class="cover empty">${ICON.products}</div>`;
  return `<button class="card" data-open="${esc(it.id)}">${cover}
    <div class="card-body">
      <div class="card-foot">${it.kind?`<span class="kind" style="${SEC_VAR.products}">${esc(it.kind)}</span>`:""}${it.course?`<span>${esc(it.course)}</span>`:""}</div>
      <div class="t">${esc(it.title)}</div>
      ${it.desc?`<div class="d">${esc(it.desc)}</div>`:""}
      <div class="card-foot">${miniLinks(it)}</div>
    </div></button>`;
}
function citePaper(it, n){
  const yr = it.date ? String(it.date).slice(0,4) : "";
  return `<button class="cite" data-open="${esc(it.id)}"><span class="num">[${n}]</span>
    <span class="au">${esc(it.authors||P().name||"")}${yr?` (${esc(yr)})`:""}. </span><span class="t">${esc(it.title)}</span>.
    ${it.venue?`<span class="venue">${esc(it.venue)}</span>.`:""}
    <span style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">${it.kind?`<span class="kind" style="${SEC_VAR.papers}">${esc(it.kind)}</span>`:""}${it.course?`<span class="lk">${esc(it.course)}</span>`:""}${miniLinks(it)}</span></button>`;
}

function renderSection(sec){
  const items = filtered(sec).sort(sortItems);
  if (!items.length) return emptyState(sec);
  let html = ""; let n = 0;
  for (let y=1;y<=4;y++){
    const yi = items.filter(i=>Number(i.year)===y); if (!yi.length) continue;
    html += `<section class="group"><div class="group-head"><h2>Năm ${y}</h2><span class="meta">${ayLabel(y)} · ${yi.length} mục</span></div>`;
    for (const [sv] of SEMS){
      const si = yi.filter(i=>i.sem===sv); if (!si.length) continue;
      html += `<div class="sem-head">${SEM_LABEL[sv]} · ${si.length}</div>`;
      if (sec==="docs") html += `<div class="register">${si.map(rowDoc).join("")}</div>`;
      else if (sec==="products") html += `<div class="cards">${si.map(cardProduct).join("")}</div>`;
      else html += si.map(it=>citePaper(it, ++n)).join("");
    }
    html += `</section>`;
  }
  return html;
}

function emptyState(sec){
  const any = data.items.some(i=>!sec || i.section===sec);
  if (any) return `<div class="empty-state"><h3>Không có mục nào khớp bộ lọc</h3><p>Thử chọn “Cả 4 năm”, bỏ lọc môn học hoặc xóa từ khóa tìm kiếm.</p></div>`;
  const what = sec ? {docs:"giáo trình, slide, ghi chép, đề ôn tập của từng môn",products:"đồ án, mô hình CAD, sản phẩm in 3D kèm ảnh và link file",papers:"bài báo, báo cáo, tiểu luận, khóa luận"}[sec] : "tài liệu môn học, sản phẩm – đồ án và bài báo – nghiên cứu";
  return `<div class="empty-state"><h3>Chưa có mục nào</h3><p>Phần này sẽ chứa ${what}, xếp theo năm học và học kỳ.</p>${st.editable?`<button class="btn primary" id="add-empty">+ Thêm mục đầu tiên</button>`:`<p class="ro-note">Chủ hồ sơ chưa đăng nội dung.</p>`}</div>`;
}

function renderOverview(){
  const now = currentPos();
  const cntAll = k => data.items.filter(i=>i.section===k).length;
  let html = `<div class="stats">${Object.entries(SECTIONS).map(([k,s])=>`<button class="stat" data-view="${k}" style="${SEC_VAR[k]}"><span class="ico">${ICON[k]}</span><span><b>${cntAll(k)}</b><span>${esc(s.label)}</span></span></button>`).join("")}</div>`;
  html += `<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Năm học</th>${SEMS.map(([v])=>`<th>${SEM_LABEL[v]}</th>`).join("")}</tr></thead><tbody>`;
  for (let y=1;y<=4;y++){
    if (st.year!=="all" && String(y)!==st.year) continue;
    html += `<tr><th><div class="y">Năm ${y}</div><div class="ay">${ayLabel(y)}</div>${now.y===y?`<span class="now-tag">Đang học</span>`:""}</th>`;
    for (const [sv] of SEMS){
      const its = data.items.filter(i=>Number(i.year)===y && i.sem===sv);
      const cnt = k => its.filter(i=>i.section===k).length;
      const key = y+"-"+sv; const isNow = now.y===y && now.sem===sv;
      html += `<td><button class="mcell" data-cell="${key}" aria-pressed="${st.cell===key}">
        <span class="tot${its.length?"":" zero"}">${its.length}</span>
        <span class="dots"><span><i style="background:var(--c-docs)"></i>${cnt("docs")}</span><span><i style="background:var(--c-prod)"></i>${cnt("products")}</span><span><i style="background:var(--c-pap)"></i>${cnt("papers")}</span></span>
        ${isNow?`<span class="now-tag">Học kỳ hiện tại</span>`:""}</button></td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;
  html += `<div class="legend"><span><i style="background:var(--c-docs)"></i>Tài liệu môn học</span><span><i style="background:var(--c-prod)"></i>Sản phẩm / Đồ án</span><span><i style="background:var(--c-pap)"></i>Bài báo / Nghiên cứu</span><span>Bấm vào một ô để xem các mục của học kỳ đó.</span></div>`;

  if (st.cell){
    const [y,sv] = st.cell.split("-");
    const its = filtered(null).filter(i=>String(i.year)===y && i.sem===sv);
    html += `<section class="group"><div class="group-head"><h2>Năm ${y} · ${SEM_LABEL[sv]}</h2><span class="meta">${ayLabel(Number(y))} · ${its.length} mục</span></div>`;
    if (!its.length) html += `<p class="ro-note">Chưa có mục nào trong học kỳ này.</p>`;
    for (const k of Object.keys(SECTIONS)){
      const s = its.filter(i=>i.section===k).sort(sortItems); if (!s.length) continue;
      html += `<div class="sem-head">${SECTIONS[k].label} · ${s.length}</div>`;
      if (k==="docs") html += `<div class="register">${s.map(rowDoc).join("")}</div>`;
      else if (k==="products") html += `<div class="cards">${s.map(cardProduct).join("")}</div>`;
      else html += s.map((it,i)=>citePaper(it,i+1)).join("");
    }
    html += `</section>`;
  } else if (!data.items.length){
    html += emptyState(null);
  } else {
    const recent = [...data.items].sort((a,b)=>String(b.added||"").localeCompare(String(a.added||""))).slice(0,6);
    html += `<section class="group"><div class="group-head"><h2>Mới cập nhật</h2><span class="meta">${data.items.length} mục trong hồ sơ</span></div><div class="register">${recent.map(it=>rowDoc({...it,course:(SECTIONS[it.section]?.label||"")+" · Năm "+it.year+" · "+SEM_LABEL[it.sem]})).join("")}</div></section>`;
  }
  return html;
}

function renderMain(){
  $("main").innerHTML = st.view==="overview" ? renderOverview() : renderSection(st.view);
}
function renderFooter(){
  const bytes = new Blob([JSON.stringify(data)]).size;
  $("foot-left").textContent = `${P().name||""} · ${P().truong||""}`;
  $("foot-right").textContent = st.editable ? `Dung lượng dữ liệu: ${(bytes/1048576).toFixed(2)} / 15,5 MB` : `Phiên bản ${data.rev||0}`;

function renderSavebar(){

  b.innerHTML = `<span>Có thay đổi chưa lưu. Người xem chỉ thấy sau khi bạn lưu.</span>

    <button class="btn" id="save" ${st.saving?"disabled":""}>${st.saving?"Đang lưu…":"Lưu & cập nhật trang"}</button>`;
}
function render(){ renderHeader(); renderNav(); renderControls(); renderMain(); renderFooter(); renderSavebar(); }

let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,3600); }

/* ---------- detail dialog ---------- */
const dlg = $("dlg");
function openDialog(html){ dlg.innerHTML = html; if (!dlg.open){ try{ dlg.showModal(); }catch(e){ dlg.setAttribute("open",""); } } dlg.scrollTop = 0; }
function closeDialog(){ try{ dlg.close(); }catch(e){ dlg.removeAttribute("open"); } dlg.innerHTML=""; }

function showItem(id){

  const s = SECTIONS[it.section];
  const rows = [["Mục",s.label],["Loại",it.kind],["Môn học",it.course],["Thời gian",`Năm ${it.year} · ${SEM_LABEL[it.sem]} (${ayLabel(Number(it.year))})`]];
  if (it.section==="papers"){ rows.push(["Tác giả",it.authors]); rows.push(["Nơi đăng",it.venue]); }
  if (it.date) rows.push(["Ngày",it.date]);
  const links = (it.links||[]).filter(l=>safeUrl(l.url));
  openDialog(`<div class="dlg-head"><h3>${esc(it.title)}</h3><button class="x" data-close aria-label="Đóng">×</button></div>
    <div class="dlg-body">

      ${it.desc?`<p class="desc">${esc(it.desc)}</p>`:""}
      ${(it.tags||[]).length?`<div class="tags">${it.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}
      ${links.length?`<div class="linklist">${links.map(l=>`<a href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer"><span class="lk">${linkKind(l.url)}</span><span style="font-weight:600;color:var(--ink)">${esc(l.label||"Mở file")}</span><span>${esc(l.url)}</span></a>`).join("")}</div>`:`<p class="ro-note">Chưa đính kèm file hoặc link.</p>`}
    </div>
    <div class="dlg-foot">${st.editable?`<button class="btn danger" data-del="${esc(it.id)}">Xóa</button><button class="btn" data-dup="${esc(it.id)}">Nhân bản</button><button class="btn primary" data-edit="${esc(it.id)}">Sửa</button>`:`<button class="btn" data-close>Đóng</button>`}</div>`);
}

/* ---------- editor ---------- */
let draftCover = null;
function editItem(id, dupFrom){
  const src = id ? data.items.find(i=>i.id===id) : (dupFrom ? data.items.find(i=>i.id===dupFrom) : null);
  const now = currentPos();
  const it = src ? JSON.parse(JSON.stringify(src)) : {section:SECTIONS[st.view]?st.view:"docs", year:(st.year!=="all"?Number(st.year):(now.y>=1&&now.y<=4?now.y:1)), sem:now.sem, links:[{label:"",url:""}], tags:[]};
  if (dupFrom){ it.title = (it.title||"") + " (bản sao)"; }
  draftCover = it.cover || null;
  const courses = [...new Set(data.items.map(i=>i.course).filter(Boolean))];
  const kindOpts = sec => SECTIONS[sec].kinds.map(k=>`<option ${it.kind===k?"selected":""}>${esc(k)}</option>`).join("");
  const links = (it.links&&it.links.length?it.links:[{label:"",url:""}]);
  openDialog(`<form id="item-form" novalidate>
    <div class="dlg-head"><h3>${id?"Sửa mục":"Thêm mục mới"}</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
    <div class="dlg-body"><div class="form">
      <label>Mục<select class="field" id="f-section">${Object.entries(SECTIONS).map(([k,s])=>`<option value="${k}" ${it.section===k?"selected":""}>${s.label}</option>`).join("")}</select></label>
      <label>Loại<select class="field" id="f-kind">${kindOpts(it.section)}</select></label>
      <label class="full">Tên / tiêu đề *<input class="field" id="f-title" required value="${esc(it.title||"")}" placeholder="VD: Giáo trình Động cơ đốt trong – Chương 1–5"></label>
      <label>Năm học<select class="field" id="f-year">${[1,2,3,4].map(y=>`<option value="${y}" ${Number(it.year)===y?"selected":""}>Năm ${y} (${ayLabel(y)})</option>`).join("")}</select></label>
      <label>Học kỳ<select class="field" id="f-sem">${SEMS.map(([v])=>`<option value="${v}" ${it.sem===v?"selected":""}>${SEM_LABEL[v]}</option>`).join("")}</select></label>
      <label>Môn học<input class="field" id="f-course" list="course-list" value="${esc(it.course||"")}" placeholder="VD: Kết cấu ô tô"><datalist id="course-list">${courses.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></label>
      <label>Ngày<input class="field" id="f-date" type="date" value="${esc(it.date||"")}"></label>
      <label class="full paper-only" ${it.section==="papers"?"":"hidden"}>Tác giả<input class="field" id="f-authors" value="${esc(it.authors||"")}" placeholder="VD: Hầu N. M. Tâm, Nguyễn V. A."></label>
      <label class="full paper-only" ${it.section==="papers"?"":"hidden"}>Nơi đăng / hội nghị / tạp chí<input class="field" id="f-venue" value="${esc(it.venue||"")}" placeholder="VD: Hội nghị Khoa học Sinh viên ĐH Lạc Hồng 2026"></label>
      <label class="full">Mô tả<textarea class="field" id="f-desc" placeholder="Nội dung chính, thông số, kết quả, ghi chú…">${esc(it.desc||"")}</textarea></label>
      <label class="full">Từ khóa <span class="hint">cách nhau bằng dấu phẩy</span><input class="field" id="f-tags" value="${esc((it.tags||[]).join(", "))}" placeholder="VD: hybrid, hộp số, SolidWorks"></label>
      <div class="full"><label style="margin-bottom:6px">File & link <span class="hint">PDF, Word, video, file CAD… để trên Google Drive / OneDrive rồi dán link chia sẻ vào đây</span></label>
        <div id="f-links">${links.map(l=>linkRow(l)).join("")}</div>
        <button type="button" class="btn" id="add-link">+ Thêm link</button></div>
      <div class="full"><label>Ảnh đại diện <span class="hint">ảnh sản phẩm, mô hình, trang bìa… (tự nén còn ~100 KB)</span></label>
        <div class="cover-prev" id="cover-prev">${coverPrev()}</div></div>
    </div></div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>Hủy</button><button type="submit" class="btn primary">${id?"Cập nhật":"Thêm vào hồ sơ"}</button></div>
  </form>`);
  const form = $("item-form");
  form.dataset.id = id || "";
  form.dataset.added = (src && !dupFrom && src.added) || "";
  $("f-section").addEventListener("change", e => {
    const sec = e.target.value;
    $("f-kind").innerHTML = SECTIONS[sec].kinds.map(k=>`<option>${esc(k)}</option>`).join("");
    form.querySelectorAll(".paper-only").forEach(el=>el.hidden = sec!=="papers");
  });
  $("f-title").focus();
}
function linkRow(l){ return `<div class="link-edit"><input class="field" data-ll placeholder="Tên (VD: Slide PDF)" value="${esc(l.label||"")}"><input class="field" data-lu type="url" placeholder="https://drive.google.com/…" value="${esc(l.url||"")}"><button type="button" class="btn" data-rmlink aria-label="Xóa link">×</button></div>`; }
function coverPrev(){
  return (draftCover?`<img src="${esc(draftCover)}" alt="Ảnh đại diện"><button type="button" class="btn" id="rm-cover">Bỏ ảnh</button>`:"")
    + `<label class="btn" style="cursor:pointer">${draftCover?"Đổi ảnh":"Chọn ảnh"}<input type="file" id="f-cover" accept="image/*" hidden></label>`;
}
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const max = 900; let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement("canvas"); c.width=w; c.height=h;
      const g = c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      let q = .78, out = c.toDataURL("image/jpeg", q);
      while (out.length > 160000 && q > .4){ q -= .1; out = c.toDataURL("image/jpeg", q); }
      res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Không đọc được ảnh")); };
    img.src = url;
  });
}
function submitItem(form){
  const title = $("f-title").value.trim();
  if (!title){ $("f-title").focus(); toast("Cần nhập tên / tiêu đề."); return; }
  const links = [...form.querySelectorAll(".link-edit")].map(r=>({label:r.querySelector("[data-ll]").value.trim(), url:r.querySelector("[data-lu]").value.trim()})).filter(l=>l.url);
  const bad = links.find(l=>!safeUrl(l.url));
  if (bad){ toast("Link phải bắt đầu bằng http:// hoặc https://"); return; }
  const sec = $("f-section").value;
  const obj = {
    id: form.dataset.id || uid(), section: sec, kind: $("f-kind").value, title,
    year: Number($("f-year").value), sem: $("f-sem").value, course: $("f-course").value.trim(),
    date: $("f-date").value, desc: $("f-desc").value.trim(),
    tags: $("f-tags").value.split(",").map(s=>s.trim()).filter(Boolean), links,
    cover: draftCover || null, added: form.dataset.added || new Date().toISOString()
  };
  if (sec==="papers"){ obj.authors = $("f-authors").value.trim(); obj.venue = $("f-venue").value.trim(); }
  const i = data.items.findIndex(x=>x.id===obj.id);
  if (i>=0) data.items[i] = obj; else data.items.push(obj);
  if (new Blob([JSON.stringify(data)]).size > MAX_BYTES){
    if (i>=0) { /* revert not tracked; just warn */ }
    toast("Dữ liệu đã gần giới hạn 15,5 MB. Hãy bỏ bớt ảnh trước khi lưu.");
  }
  markDirty(); closeDialog();
  if (st.view !== "overview" && st.view !== sec) st.view = sec;
  render(); toast(i>=0 ? "Đã cập nhật mục. Nhớ bấm Lưu." : "Đã thêm mục. Nhớ bấm Lưu.");
}

function editProfile(){
  const p = P();
  const f = [["name","Họ tên"],["mssv","MSSV"],["lop","Lớp"],["nienKhoa","Niên khóa"],["khoa","Khoa"],["nganh","Ngành"],["truong","Trường"],["startYear","Năm bắt đầu (năm 1)"]];
  openDialog(`<form id="profile-form" novalidate><div class="dlg-head"><h3>Thông tin hồ sơ</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
    <div class="dlg-body"><div class="form">${f.map(([k,l])=>`<label>${l}<input class="field" id="p-${k}" ${k==="startYear"?'type="number" min="2000" max="2100"':""} value="${esc(p[k]??"")}"></label>`).join("")}
    <label class="full">Lời giới thiệu<textarea class="field" id="p-intro">${esc(p.intro||"")}</textarea></label></div></div>
    <div class="dlg-foot"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary" type="submit">Áp dụng</button></div></form>`);
}

/* ---------- dirty state & publishing ---------- */
const STASH = "hs-pending";
function markDirty(){ st.dirty = true; try{ sessionStorage.setItem(STASH, JSON.stringify({baseRev:data.rev||0, data})); }catch(e){} }
function buildHtml(){
  const json = JSON.stringify(data).replace(/</g,"\\u003c").replace(new RegExp(String.fromCharCode(0x2028),"g"),"\\u2028").replace(new RegExp(String.fromCharCode(0x2029),"g"),"\\u2029");
  const dataTag = '<script type="application/json" id="archive-data" data-keep>' + json + '</scr' + 'ipt>';
  const body = KEEP.map(h => h === null ? dataTag : h).join("\n");
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + (HEAD_STYLE || FALLBACK_RESET) + '</style></head><body>' + body + '</body></html>';
}
async function save(){
  if (!st.artifact || st.saving) return;
  const prevRev = data.rev || 0;
  data.rev = prevRev + 1;
  const html = buildHtml();
  if (html.length > 16*1024*1024){ data.rev = prevRev; toast("Trang vượt 16 MB. Hãy bỏ bớt ảnh rồi lưu lại."); return; }
  st.saving = true; renderSavebar();
  try { sessionStorage.setItem(STASH, JSON.stringify({baseRev:prevRev, nextRev:data.rev, data})); } catch(e){}
  try {
    await st.artifact.publish(html);
    toast("Đã lưu. Trang đang tải lại bản mới…");
  } catch(err){
    data.rev = prevRev; st.saving = false;
    const code = err && err.code;
    if (code === "conflict"){ toast("Trang vừa được cập nhật ở nơi khác. Đang tải bản mới; thay đổi của bạn được giữ để khôi phục."); }
    else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "capability_disabled" || code === "not_declared"){ st.editable = false; st.dirty = false; render(); toast("Bạn đang ở chế độ chỉ xem nên không lưu được."); }
    else if (code === "too_large"){ toast("Trang quá lớn để lưu. Hãy bỏ bớt ảnh."); }
    else if (code === "rate_limited"){ toast("Lưu quá nhanh. Đợi một lúc rồi bấm Lưu lại."); }
    else { toast("Chưa lưu được (lỗi tạm thời). Thử bấm Lưu lại."); }
    renderSavebar();
  }
}
function restoreStash(){
  let s; try{ s = JSON.parse(sessionStorage.getItem(STASH)||"null"); }catch(e){ s = null; }
  if (!s) return;
  const cur = data.rev || 0;
  if (s.nextRev && s.nextRev === cur){ try{ sessionStorage.removeItem(STASH); }catch(e){} return; }
  if (s.baseRev === cur){ data = s.data; data.rev = cur; st.dirty = true; return; }
  // the page moved on since the stash was taken
  st.staleStash = s;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button, [data-close]"); if (!t) return;
  if (t.dataset.view){ st.view = t.dataset.view; st.course="all"; try{ sessionStorage.setItem("hs-view", st.view);}catch(_){} render(); return; }
  if (t.dataset.year){ st.year = t.dataset.year; st.cell = null; render(); return; }
  if (t.dataset.cell){ st.cell = st.cell===t.dataset.cell ? null : t.dataset.cell; renderMain(); return; }
  if (t.dataset.open){ showItem(t.dataset.open); return; }
  if (t.hasAttribute("data-close")){ closeDialog(); return; }
  if (t.dataset.edit){ editItem(t.dataset.edit); return; }
  if (t.dataset.dup){ editItem(null, t.dataset.dup); return; }
  if (t.dataset.del){
    if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent = "Bấm lần nữa để xóa"; return; }
    data.items = data.items.filter(i=>i.id!==t.dataset.del); markDirty(); closeDialog(); render(); toast("Đã xóa mục. Nhớ bấm Lưu."); return;
  }
  if (t.dataset.rmlink !== undefined && t.hasAttribute("data-rmlink")){ t.closest(".link-edit").remove(); return; }
  switch (t.id){
    case "add": case "add-empty": editItem(null); break;
    case "edit-profile": editProfile(); break;
    case "add-link": $("f-links").insertAdjacentHTML("beforeend", linkRow({})); break;
    case "rm-cover": draftCover = null; $("cover-prev").innerHTML = coverPrev(); break;
    case "save": save(); break;
    case "discard":
      if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent = "Bấm lần nữa để bỏ"; return; }
      try{ sessionStorage.removeItem(STASH);}catch(_){} location.reload(); break;
    case "recover":
      if (st.staleStash){ const base = data.rev||0; data = st.staleStash.data; data.rev = base; st.staleStash = null; st.dirty = true; markDirty(); render(); toast("Đã khôi phục bản nháp. Kiểm tra rồi bấm Lưu."); }
      break;
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q"){ st.q = e.target.value; st.cell = st.cell; renderMain(); }
});
document.addEventListener("change", async e => {
  if (e.target.id === "course"){ st.course = e.target.value; renderMain(); }
  if (e.target.id === "f-cover" && e.target.files && e.target.files[0]){
    try { draftCover = await compressImage(e.target.files[0]); $("cover-prev").innerHTML = coverPrev(); }
    catch(err){ toast("Không đọc được ảnh này. Thử ảnh JPG hoặc PNG khác."); }
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "item-form") submitItem(e.target);
  if (e.target.id === "profile-form"){
    const p = P(); ["name","mssv","lop","nienKhoa","khoa","nganh","truong"].forEach(k=>p[k]=$("p-"+k).value.trim());
    const sy = parseInt($("p-startYear").value,10); if (sy>=2000 && sy<=2100) p.startYear = sy;
    p.intro = $("p-intro").value.trim(); data.profile = p; markDirty(); closeDialog(); render(); toast("Đã cập nhật thông tin. Nhớ bấm Lưu.");
  }
});
dlg.addEventListener("cancel", () => { dlg.innerHTML = ""; });

/* ---------- boot ---------- */
render();
(async () => {
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [art, user] = await Promise.all([window.claude.use("artifact"), window.claude.use("user")]);
    let can = false;
    if (art && user){ try { can = await user.canEdit(); } catch(e){ can = false; } }
    if (art && can){
      st.artifact = art; st.editable = true;
      restoreStash(); render();
      if (st.staleStash){
        const b = $("savebar"); b.hidden = false;
        b.innerHTML = `<span>Có bản nháp chưa lưu từ phiên trước.</span><button class="btn" id="recover">Khôi phục bản nháp</button>`;
      }
    }
  } catch(e){ /* read-only view */ }
})();
})();
</script>
