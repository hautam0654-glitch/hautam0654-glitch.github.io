<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tài liệu Ô tô 24OT113</title>
<meta name="description" content="Kho tài liệu các môn chuyên ngành Công nghệ Kỹ thuật Ô tô – Hầu Ngọc Minh Tâm, Đại học Lạc Hồng.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: top bar + hero, then subject cards grouped by semester; a subject opens into its document list with a drop zone for the owner. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#0E1626; --muted:#5A6478; --line:#E2E6EE;
  --accent:#2457E8; --accent-soft:#E8EEFF; --accent-ink:#FFFFFF;
  --good:#0E9468; --good-soft:#E2F5EE; --warm:#D9620F; --warm-soft:#FDEEE4; --danger:#C62828; --danger-soft:#FCE9E9;
  --shadow:0 1px 2px rgba(14,22,38,.05),0 4px 16px rgba(14,22,38,.06);
  --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif; --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A0E15; --surface:#121925; --surface-2:#172031; --ink:#E8ECF4; --muted:#8C97AD; --line:#232D3E;
  --accent:#7097FF; --accent-soft:#1B2847; --accent-ink:#0A0E15;
  --good:#3FCB98; --good-soft:#123227; --warm:#FF8F4F; --warm-soft:#3A2416; --danger:#FF6B6B; --danger-soft:#3A1A1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html,body,button,input,select,textarea,dialog{font-family:var(--font)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:var(--ink);min-width:0;background:none;border:0;cursor:pointer;padding:0}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--good));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:22px 110px}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-width:0;outline:none;width:100%}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none}
.eyebrow{font-size:12.5px;font-weight:600;color:var(--accent);position:relative}
h1{font-size:clamp(25px,3.6vw,36px);font-weight:800;line-height:1.15;margin:6px 0 8px;letter-spacing:-.015em;text-wrap:balance;position:relative}
.intro{color:var(--muted);margin:0;max-width:66ch;position:relative}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative}
.fact{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.fact b{font-weight:600}
.fact span{color:var(--muted);margin-right:5px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 4px}
.bar .field{flex:1 1 240px;width:auto}
.sem{margin-top:26px}
.sem-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sem-head h2{font-size:19px;font-weight:800;margin:0}
.sem-head span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.sub{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.sub:hover{transform:translateY(-3px);border-color:var(--accent)}
.sub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub-name{font-weight:700;line-height:1.35;font-size:15.5px}
.score{font-weight:800;font-size:17px;padding:2px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.score.top{background:var(--good-soft);color:var(--good)}
.sub-foot{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.has{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.subhead{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.subhead h2{font-size:clamp(21px,3vw,28px);font-weight:800;margin:2px 0 6px;line-height:1.2;text-wrap:balance}
.subhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.subhead .big{margin-left:auto;text-align:center}
.subhead .big b{display:block;font-size:34px;font-weight:800;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}
.subhead .big span{font-size:12px;color:var(--muted)}

.drop{margin-top:16px;border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.drop b{color:var(--ink);display:block;font-size:16px;margin-bottom:2px}
.docs{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.doc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.ext{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent)}
.ext.pdf{background:var(--danger-soft);color:var(--danger)} .ext.ppt{background:var(--warm-soft);color:var(--warm)} .ext.xls,.ext.img{background:var(--good-soft);color:var(--good)}
.doc .t{font-weight:600;overflow-wrap:anywhere}
.doc .d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;color:var(--muted);margin-top:16px;background:var(--surface)}
.empty h3{font-size:18px;font-weight:800;color:var(--ink);margin:0 0 4px}
.empty p{margin:0 auto;max-width:52ch}
.note{font-size:13px;color:var(--muted);margin-top:10px}

.queue{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px}
.q-top{display:flex;justify-content:space-between;gap:10px}
.q-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prog{height:6px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.q.err{border-color:var(--danger);color:var(--danger)} .q.done .prog i{background:var(--good)}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,12,20,.55);backdrop-filter:blur(3px)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 8px}
.dh h3{font-size:20px;font-weight:800;margin:0;flex:1;line-height:1.25}
.x{appearance:none;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);flex:none}
.db{padding:8px 22px 16px;display:flex;flex-direction:column;gap:12px}
.df{padding:14px 22px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .field{color:var(--ink);font-weight:400;font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.msg.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
ol.steps{margin:0;padding-left:20px;font-size:14px;color:var(--muted)} ol.steps b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:40;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.owner-chip{font-size:12.5px;font-weight:600;color:var(--good);background:var(--good-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:640px){
  .top-in,.wrap{padding-inline:16px}
  .hero{padding:20px;border-radius:16px}
  .doc{grid-template-columns:40px minmax(0,1fr)}
  .doc .acts{grid-column:2;justify-content:flex-start}
  .ext{width:40px;height:40px}
  .two{grid-template-columns:1fr}
  .subhead .big{margin-left:0}
  .owner-chip{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <button class="brand" id="home"><span class="logo" id="logo">HT</span><span class="t">Tài liệu Ô tô 24OT113</span></button>
  <span class="grow"></span>
  <span class="owner-chip" id="owner-chip" hidden>Đang đăng nhập (chủ trang)</span>
  <button class="btn" id="login-btn">Đăng nhập</button>
</div></div>
<div class="wrap">
  <main id="main"></main>
  <footer><span id="foot-l"></span><span id="foot-r"></span></footer>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- where the site lives ---------- */
const OWNER = "hautam0654-glitch", REPO = "hautam0654-glitch.github.io", BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const TOKEN_KEY = "tl-oto-token";
const MAX_FILE = 40 * 1024 * 1024;
const KINDS = ["Giáo trình","Bài giảng / Slide","Bài tập","Đề thi / Ôn tập","Báo cáo / Đồ án","Bản vẽ / CAD","Ghi chép","Khác"];

/* ---------- state ---------- */
let data = {profile:{}, settings:{showScores:true}, subjects:[], docs:[]};
let dataSha = null;
let token = null;
const st = {view:"home", code:null, q:"", loaded:false, error:null, queue:[]};
try { token = localStorage.getItem(TOKEN_KEY) || null; } catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
const uid = () => "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtSize = b => !b ? "" : b < 1024*1024 ? Math.max(1,Math.round(b/1024)) + " KB" : (b/1048576).toFixed(1).replace(".",",") + " MB";
const fmtScore = s => (s === null || s === undefined || s === "") ? "" : Number(s).toFixed(1).replace(".",",");
const initials = n => { const w = String(n||"").trim().split(/\s+/).filter(Boolean); return ((w[0]||"?")[0] + (w.length>1 ? w[w.length-1][0] : "")).toUpperCase(); };
function b64utf8(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function utf8b64(b64){ const bin = atob(b64.replace(/\s/g,"")); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function slugFile(name){
  const dot = name.lastIndexOf("."); const ext = dot > 0 ? name.slice(dot+1).toLowerCase().replace(/[^a-z0-9]/g,"") : "";
  let base = (dot > 0 ? name.slice(0,dot) : name).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "file";
  return base + "-" + Date.now().toString(36) + (ext ? "." + ext : "");
}
function extOf(d){ const n = d.name || d.path || ""; const m = /\.([a-z0-9]+)$/i.exec(n); return m ? m[1].toLowerCase() : (d.link ? "link" : "file"); }
function extClass(e){ if (e==="pdf") return "pdf"; if (/^pptx?$/.test(e)) return "ppt"; if (/^(xlsx?|csv)$/.test(e)) return "xls"; if (/^(png|jpe?g|gif|webp)$/.test(e)) return "img"; return ""; }

let toastT;
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,4200); }

/* ---------- GitHub API (only used when the owner is signed in) ---------- */
async function gh(path, opts){
  const r = await fetch(API + path, Object.assign({}, opts, {headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}, (opts&&opts.headers)||{})}));
  if (r.status === 401){ const e = new Error("Mã truy cập hết hạn hoặc không đúng."); e.code = 401; throw e; }
  if (!r.ok){ const e = new Error("GitHub trả về lỗi " + r.status); e.code = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function loadData(){
  st.error = null;
  try {
    if (token){
      const j = await gh(`/contents/data.json?ref=${BRANCH}&t=${Date.now()}`);
      dataSha = j.sha; data = JSON.parse(utf8b64(j.content));
    } else {
      const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      data = await r.json();
    }
  } catch(e){
    if (e.code === 401){ signOut(true); return loadData(); }
    st.error = "Chưa tải được dữ liệu. Kiểm tra mạng rồi tải lại trang.";
  }
  data.subjects = Array.isArray(data.subjects) ? data.subjects : [];
  data.docs = Array.isArray(data.docs) ? data.docs : [];
  data.settings = data.settings || {showScores:true};
  data.profile = data.profile || {};
  st.loaded = true;
}
async function saveData(message){
  const body = () => JSON.stringify({message, branch:BRANCH, sha:dataSha, content:b64utf8(JSON.stringify(data, null, 1))});
  try {
    const j = await gh("/contents/data.json", {method:"PUT", body:body()});
    dataSha = j.content.sha;
  } catch(e){
    if (e.code === 409 || e.code === 422){
      const cur = await gh(`/contents/data.json?ref=${BRANCH}&t=${Date.now()}`); dataSha = cur.sha;
      const j = await gh("/contents/data.json", {method:"PUT", body:body()}); dataSha = j.content.sha;
    } else throw e;
  }
}
function putFile(path, base64, message, onProgress){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("PUT", API + "/contents/" + path.split("/").map(encodeURIComponent).join("/"));
    x.setRequestHeader("Accept","application/vnd.github+json"); x.setRequestHeader("Authorization","Bearer "+token);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded/e.total); };
    x.onload = () => x.status >= 200 && x.status < 300 ? res(JSON.parse(x.responseText)) : rej(Object.assign(new Error("GitHub trả về lỗi " + x.status), {code:x.status}));
    x.onerror = () => rej(new Error("Mất kết nối khi tải lên."));
    x.send(JSON.stringify({message, branch:BRANCH, content:base64}));
  });
}
function readBase64(file){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(new Error("Không đọc được file.")); fr.readAsDataURL(file); }); }

/* ---------- rendering ---------- */
function docsOf(code){ return data.docs.filter(d => d.subject === code); }
function scoreHtml(s){ if (!data.settings.showScores || s.score === null || s.score === undefined || s.score === "") return ""; return `<span class="score${Number(s.score) >= 9 ? " top" : ""}" title="Điểm trung bình môn">${fmtScore(s.score)}</span>`; }

function renderChrome(){
  const p = data.profile;
  $("logo").textContent = initials(p.name || "HT");
  $("login-btn").textContent = token ? "Đăng xuất" : "Đăng nhập";
  $("owner-chip").hidden = !token;
  $("foot-l").textContent = [p.name, p.truong].filter(Boolean).join(" · ");
  $("foot-r").textContent = data.docs.length + " tài liệu · " + data.subjects.length + " môn";
}

function renderHome(){
  const p = data.profile; const q = st.q.trim().toLowerCase();
  let html = `<header class="hero">
    <div class="eyebrow">${esc(p.nganh || "Công nghệ Kỹ thuật Ô tô")}${p.nienKhoa ? " · " + esc(p.nienKhoa) : ""}</div>
    <h1>Tài liệu các môn chuyên ngành</h1>
    <p class="intro">${esc(p.intro || "")}</p>
    <div class="facts">${[["Sinh viên",p.name],["Lớp",p.lop],["Trường",p.truong]].filter(f=>f[1]).map(([k,v])=>`<span class="fact"><span>${esc(k)}</span><b>${esc(v)}</b></span>`).join("")}</div>
  </header>`;
  html += `<div class="bar"><input class="field" id="q" type="search" placeholder="Tìm môn học hoặc tài liệu…" value="${esc(st.q)}" aria-label="Tìm kiếm">
    ${token ? `<button class="btn" id="edit-profile">Sửa thông tin</button><button class="btn primary" id="add-sub">+ Thêm môn</button>` : ""}</div>`;
  if (st.error) html += `<div class="empty"><h3>Không tải được dữ liệu</h3><p>${esc(st.error)}</p></div>`;
  html += `<div id="list">${homeList(q)}</div>`;
  $("main").innerHTML = html;
}
function homeList(q){
  if (q){
    const subs = data.subjects.filter(s => (s.name + " " + s.code).toLowerCase().includes(q));
    const docs = data.docs.filter(d => [d.title,d.kind,d.note,d.name].join(" ").toLowerCase().includes(q));
    if (!subs.length && !docs.length) return `<div class="empty"><h3>Không tìm thấy</h3><p>Không có môn học hay tài liệu nào khớp “${esc(st.q)}”.</p></div>`;
    let h = "";
    if (subs.length) h += `<section class="sem"><div class="sem-head"><h2>Môn học</h2><span>${subs.length} kết quả</span></div><div class="grid">${subs.map(cardSub).join("")}</div></section>`;
    if (docs.length) h += `<section class="sem"><div class="sem-head"><h2>Tài liệu</h2><span>${docs.length} kết quả</span></div><div class="docs">${docs.map(d => rowDoc(d, true)).join("")}</div></section>`;
    return h;
  }
  if (!data.subjects.length) return st.error ? "" : `<div class="empty"><h3>Chưa có môn học nào</h3><p>${token ? "Bấm “+ Thêm môn” để tạo môn đầu tiên." : "Chủ trang chưa thêm môn học."}</p></div>`;
  const sems = [...new Set(data.subjects.map(s => Number(s.sem)||0))].sort((a,b)=>a-b);
  return sems.map(n => {
    const subs = data.subjects.filter(s => (Number(s.sem)||0) === n).sort((a,b) => (Number(b.score)||0) - (Number(a.score)||0));
    return `<section class="sem"><div class="sem-head"><h2>${n ? "Học kỳ " + n : "Khác"}</h2><span>${n ? "Năm " + Math.ceil(n/2) + " · " : ""}${subs.length} môn</span></div><div class="grid">${subs.map(cardSub).join("")}</div></section>`;
  }).join("");
}
function cardSub(s){
  const n = docsOf(s.code).length;
  return `<button class="sub" data-sub="${esc(s.code)}">
    <div class="sub-top"><div><div class="code">Mã ${esc(s.code)}</div><div class="sub-name">${esc(s.name)}</div></div>${scoreHtml(s)}</div>
    <div class="sub-foot"><span class="pill${n ? " has" : ""}">${n ? n + " tài liệu" : "Chưa có tài liệu"}</span>${s.credits ? `<span>Hệ số ${esc(s.credits)}</span>` : ""}</div>
  </button>`;
}
function rowDoc(d, withSubject){
  const e = extOf(d); const href = d.path ? d.path.split("/").map(encodeURIComponent).join("/") : safeUrl(d.link);
  const sub = withSubject ? data.subjects.find(s => s.code === d.subject) : null;
  const meta = [sub ? sub.name : "", d.kind, fmtSize(d.size), d.added ? new Date(d.added).toLocaleDateString("vi-VN") : ""].filter(Boolean).join(" · ");
  return `<div class="doc"><span class="ext ${extClass(e)}">${esc(e.slice(0,4).toUpperCase())}</span>
    <div style="min-width:0"><div class="t">${esc(d.title)}</div><div class="d">${esc(meta)}</div>${d.note ? `<div class="d">${esc(d.note)}</div>` : ""}</div>
    <div class="acts">${href ? `<a class="btn sm primary" href="${esc(href)}" target="_blank" rel="noopener">${d.path ? "Mở / Tải" : "Mở link"}</a>` : ""}${token ? `<button class="btn sm" data-edit-doc="${esc(d.id)}">Sửa</button><button class="btn sm danger" data-del-doc="${esc(d.id)}">Xóa</button>` : ""}</div></div>`;
}
function renderSubject(){
  const s = data.subjects.find(x => x.code === st.code);
  if (!s){ st.view = "home"; return renderHome(); }
  const docs = docsOf(s.code).sort((a,b) => String(b.added||"").localeCompare(String(a.added||"")));
  const showScore = data.settings.showScores && s.score !== null && s.score !== undefined && s.score !== "";
  let html = `<div class="crumb"><button class="btn sm" id="back">← Tất cả môn</button></div>
  <div class="subhead"><div style="min-width:0;flex:1 1 300px"><div class="code">Mã môn ${esc(s.code)}</div><h2>${esc(s.name)}</h2>
    <div class="meta">${s.sem ? `<span class="pill">Học kỳ ${esc(s.sem)}</span>` : ""}${s.credits ? `<span class="pill">Hệ số ${esc(s.credits)}</span>` : ""}<span class="pill${docs.length ? " has" : ""}">${docs.length} tài liệu</span></div>
    ${s.note ? `<p class="note">${esc(s.note)}</p>` : ""}
    ${token ? `<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" id="edit-sub">Sửa môn</button><button class="btn sm" id="add-link">+ Thêm link (Drive, YouTube…)</button></div>` : ""}</div>
    ${showScore ? `<div class="big"><b>${fmtScore(s.score)}</b><span>Điểm trung bình</span></div>` : ""}</div>`;
  if (token) html += `<div class="drop" id="drop" tabindex="0" role="button"><b>Kéo thả file vào đây</b>hoặc bấm để chọn file · PDF, Word, PowerPoint, Excel, ảnh, file nén… · tối đa 40 MB mỗi file<input type="file" id="file-in" multiple hidden></div><div class="queue" id="queue"></div>`;
  html += docs.length ? `<div class="docs">${docs.map(d => rowDoc(d)).join("")}</div>` : `<div class="empty"><h3>Chưa có tài liệu</h3><p>${token ? "Kéo thả file vào khung phía trên để thêm tài liệu cho môn này." : "Môn này chưa có tài liệu nào được đăng."}</p></div>`;
  if (token && docs.length) html += `<p class="note">File mới tải lên cần khoảng 1 phút để người xem bên ngoài mở được.</p>`;
  $("main").innerHTML = html;
  renderQueue();
}
function renderQueue(){
  const el = $("queue"); if (!el) return;
  el.innerHTML = st.queue.map(q => `<div class="q ${q.state}"><div class="q-top"><span>${esc(q.name)}</span><span>${q.state==="err" ? esc(q.msg) : q.state==="done" ? "Xong" : Math.round(q.p*100) + "%"}</span></div>${q.state==="err" ? "" : `<div class="prog"><i style="width:${Math.round(q.p*100)}%"></i></div>`}</div>`).join("");
}
function render(){ renderChrome(); if (st.view === "subject") renderSubject(); else renderHome(); }
function go(view, code){ st.view = view; st.code = code || null; const h = view === "subject" ? "#mon-" + code : "#"; if (location.hash !== h) history.pushState(null, "", h === "#" ? location.pathname : h); render(); window.scrollTo(0,0); }
function fromHash(){ const m = /^#mon-(.+)$/.exec(location.hash); if (m && data.subjects.some(s => s.code === decodeURIComponent(m[1]))){ st.view = "subject"; st.code = decodeURIComponent(m[1]); } else { st.view = "home"; st.code = null; } }

/* ---------- uploads ---------- */
let uploading = false;
async function addFiles(files){
  if (!token || !st.code) return;
  const code = st.code;
  for (const f of files){
    if (f.size > MAX_FILE){ st.queue.push({name:f.name, p:0, state:"err", msg:"Quá 40 MB – hãy để trên Drive rồi thêm link"}); continue; }
    if (f.size === 0){ st.queue.push({name:f.name, p:0, state:"err", msg:"File rỗng"}); continue; }
    st.queue.push({name:f.name, p:0, state:"wait", file:f, code});
  }
  renderQueue();
  if (uploading) return;
  uploading = true;
  let added = 0;
  try {
    for (const q of st.queue){
      if (q.state !== "wait") continue;
      q.state = "up"; renderQueue();
      try {
        const b64 = await readBase64(q.file);
        const path = "files/" + q.code + "/" + slugFile(q.file.name);
        await putFile(path, b64, "Thêm tài liệu: " + q.file.name, p => { q.p = p * .95; renderQueue(); });
        data.docs.push({id:uid(), subject:q.code, title:q.file.name.replace(/\.[^.]+$/,""), kind:"", note:"", path, name:q.file.name, size:q.file.size, added:new Date().toISOString()});
        q.p = 1; q.state = "done"; q.file = null; added++;
      } catch(e){
        q.state = "err"; q.file = null; q.msg = e.code === 401 ? "Cần đăng nhập lại" : e.code === 403 ? "Mã truy cập thiếu quyền ghi" : (e.message || "Lỗi tải lên");
        if (e.code === 401){ signOut(true); break; }
      }
      renderQueue();
    }
    if (added){ await saveData("Cập nhật danh sách tài liệu (+" + added + ")"); toast("Đã tải lên " + added + " file."); }
  } catch(e){ toast("Tải file xong nhưng chưa ghi được danh sách. Tải lại trang rồi thử lại."); }
  uploading = false;
  st.queue = st.queue.filter(q => q.state === "err");
  render();
}

/* ---------- dialogs ---------- */
const dlg = $("dlg");
function openDlg(html){ dlg.innerHTML = html; if (!dlg.open){ try { dlg.showModal(); } catch(e){ dlg.setAttribute("open",""); } } }
function closeDlg(){ try { dlg.close(); } catch(e){ dlg.removeAttribute("open"); } dlg.innerHTML = ""; }

function loginDlg(){
  openDlg(`<form id="login-form" novalidate><div class="dh"><h3>Đăng nhập chủ trang</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
  <div class="db">
    <div class="msg">Chỉ chủ trang mới cần đăng nhập để thêm, sửa, xóa tài liệu. Người xem không cần đăng nhập.</div>
    <label class="f">Mã truy cập GitHub (bắt đầu bằng github_pat_…)<input class="field" id="tok" type="password" autocomplete="off" placeholder="Dán mã truy cập vào đây" required></label>
    <div class="msg err" id="login-err" hidden></div>
    <ol class="steps"><li>Mã truy cập do bạn tạo trong tài khoản GitHub, chỉ có quyền ghi vào kho của trang này.</li><li>Mã được lưu <b>chỉ trên trình duyệt này</b>. Không đăng nhập trên máy lạ.</li></ol>
  </div>
  <div class="df"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary" type="submit" id="login-go">Đăng nhập</button></div></form>`);
  $("tok").focus();
}
async function doLogin(){
  const v = $("tok").value.trim(); const err = $("login-err"); err.hidden = true;
  if (!v){ $("tok").focus(); return; }
  $("login-go").disabled = true; $("login-go").textContent = "Đang kiểm tra…";
  try {
    const r = await fetch(API, {headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer " + v}});
    if (r.status === 401) throw new Error("Mã truy cập không đúng hoặc đã hết hạn.");
    if (!r.ok) throw new Error("Mã này không truy cập được kho của trang (lỗi " + r.status + ").");
    const j = await r.json();
    if (!j.permissions || !j.permissions.push) throw new Error("Mã này chưa có quyền ghi (Contents: Read and write) vào kho của trang.");
    token = v; try { localStorage.setItem(TOKEN_KEY, v); } catch(e){}
    closeDlg(); await loadData(); fromHash(); render(); toast("Đã đăng nhập. Bạn có thể thêm tài liệu.");
  } catch(e){
    err.textContent = e.message || "Không đăng nhập được. Kiểm tra mạng rồi thử lại."; err.hidden = false;
    $("login-go").disabled = false; $("login-go").textContent = "Đăng nhập";
  }
}
function signOut(silent){ token = null; dataSha = null; try { localStorage.removeItem(TOKEN_KEY); } catch(e){} if (!silent){ render(); toast("Đã đăng xuất."); } }

function subjectDlg(s){
  const isNew = !s; s = s || {code:"", name:"", sem:"", credits:"", score:"", note:""};
  openDlg(`<form id="sub-form" novalidate data-orig="${esc(isNew ? "" : s.code)}"><div class="dh"><h3>${isNew ? "Thêm môn học" : "Sửa môn học"}</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
  <div class="db"><label class="f">Tên môn học *<input class="field" id="s-name" value="${esc(s.name)}" placeholder="VD: Hệ thống điều khiển tự động trên ô tô"></label>
    <div class="two"><label class="f">Mã môn *<input class="field" id="s-code" value="${esc(s.code)}" placeholder="VD: 148025" ${isNew ? "" : "readonly"}></label>
    <label class="f">Học kỳ (1–8)<input class="field" id="s-sem" type="number" min="1" max="8" value="${esc(s.sem)}"></label></div>
    <div class="two"><label class="f">Hệ số<input class="field" id="s-credits" type="number" min="0" max="20" value="${esc(s.credits)}"></label>
    <label class="f">Điểm trung bình<input class="field" id="s-score" type="number" min="0" max="10" step="0.01" value="${esc(s.score ?? "")}" placeholder="Để trống nếu chưa có"></label></div>
    <label class="f">Ghi chú<input class="field" id="s-note" value="${esc(s.note||"")}" placeholder="Nội dung chính của môn (không bắt buộc)"></label>
    <div class="msg err" id="sub-err" hidden></div></div>
  <div class="df">${isNew ? "" : `<button type="button" class="btn danger" id="del-sub" style="margin-right:auto">Xóa môn</button>`}<button type="button" class="btn" data-close>Hủy</button><button class="btn primary" type="submit">Lưu</button></div></form>`);
  $("s-name").focus();
}
function docDlg(d){
  const isNew = !d; d = d || {title:"", kind:"", note:"", link:""};
  openDlg(`<form id="doc-form" novalidate data-id="${esc(d.id||"")}"><div class="dh"><h3>${isNew ? "Thêm link tài liệu" : "Sửa tài liệu"}</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
  <div class="db"><label class="f">Tên hiển thị *<input class="field" id="d-title" value="${esc(d.title)}"></label>
    <label class="f">Loại<select class="field" id="d-kind"><option value="">— Không chọn —</option>${KINDS.map(k => `<option ${d.kind===k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label>
    ${isNew || d.link ? `<label class="f">Link (Google Drive, YouTube…) *<input class="field" id="d-link" type="url" value="${esc(d.link||"")}" placeholder="https://"></label>` : ""}
    <label class="f">Ghi chú<input class="field" id="d-note" value="${esc(d.note||"")}" placeholder="VD: Chương 1–5, bản có lời giải"></label>
    <div class="msg err" id="doc-err" hidden></div></div>
  <div class="df"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary" type="submit">Lưu</button></div></form>`);
  $("d-title").focus();
}
function profileDlg(){
  const p = data.profile; const f = [["name","Họ tên"],["lop","Lớp"],["truong","Trường"],["nganh","Ngành"],["nienKhoa","Niên khóa"]];
  openDlg(`<form id="prof-form" novalidate><div class="dh"><h3>Thông tin trang</h3><button type="button" class="x" data-close aria-label="Đóng">×</button></div>
  <div class="db">${f.map(([k,l]) => `<label class="f">${l}<input class="field" id="p-${k}" value="${esc(p[k]||"")}"></label>`).join("")}
    <label class="f">Lời giới thiệu<textarea class="field" id="p-intro" rows="3">${esc(p.intro||"")}</textarea></label>
    <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="p-scores" ${data.settings.showScores ? "checked" : ""}> Hiện điểm trung bình của từng môn cho người xem</label></div>
  <div class="df"><button type="button" class="btn" data-close>Hủy</button><button class="btn primary" type="submit">Lưu</button></div></form>`);
}
async function commit(message, okMsg){
  try { await saveData(message); render(); toast(okMsg); }
  catch(e){ if (e.code === 401){ signOut(true); render(); toast("Phiên đăng nhập hết hạn. Hãy đăng nhập lại."); } else { toast("Chưa lưu được. Kiểm tra mạng rồi thử lại."); await loadData(); render(); } }
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  if (e.target.id === "file-in") return;
  const t = e.target.closest("button, a, [data-close], .drop"); if (!t) return;
  if (t.hasAttribute("data-close")){ closeDlg(); return; }
  if (t.dataset.sub){ go("subject", t.dataset.sub); return; }
  if (t.dataset.editDoc){ docDlg(data.docs.find(d => d.id === t.dataset.editDoc)); return; }
  if (t.dataset.delDoc){
    if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent = "Bấm lần nữa"; return; }
    const d = data.docs.find(x => x.id === t.dataset.delDoc); if (!d) return;
    t.disabled = true;
    try {
      if (d.path){ try { const f = await gh("/contents/" + d.path.split("/").map(encodeURIComponent).join("/") + "?ref=" + BRANCH); await gh("/contents/" + d.path.split("/").map(encodeURIComponent).join("/"), {method:"DELETE", body:JSON.stringify({message:"Xóa tài liệu: " + d.title, sha:f.sha, branch:BRANCH})}); } catch(err){ if (err.code !== 404) throw err; } }
      data.docs = data.docs.filter(x => x.id !== d.id);
      await commit("Xóa tài liệu: " + d.title, "Đã xóa tài liệu.");
    } catch(err){ toast("Chưa xóa được. Thử lại sau."); render(); }
    return;
  }
  switch (t.id){
    case "home": case "back": go("home"); break;
    case "login-btn": token ? signOut() : loginDlg(); break;
    case "add-sub": subjectDlg(null); break;
    case "edit-sub": subjectDlg(data.subjects.find(s => s.code === st.code)); break;
    case "add-link": docDlg(null); break;
    case "edit-profile": profileDlg(); break;
    case "drop": $("file-in").click(); break;
    case "del-sub": {
      const code = $("sub-form").dataset.orig;
      if (docsOf(code).length){ const er = $("sub-err"); er.textContent = "Môn này còn tài liệu. Hãy xóa hết tài liệu trước khi xóa môn."; er.hidden = false; return; }
      if (!t.classList.contains("armed")){ t.classList.add("armed"); t.textContent = "Bấm lần nữa để xóa"; return; }
      data.subjects = data.subjects.filter(s => s.code !== code); closeDlg(); st.view = "home"; st.code = null; history.replaceState(null,"",location.pathname);
      await commit("Xóa môn " + code, "Đã xóa môn học."); break;
    }
  }
});
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "login-form") return doLogin();
  if (f.id === "sub-form"){
    const er = $("sub-err"); const name = $("s-name").value.trim(); const code = $("s-code").value.trim().replace(/[^A-Za-z0-9_-]/g,"");
    if (!name || !code){ er.textContent = "Cần nhập tên môn và mã môn (mã chỉ gồm chữ, số)."; er.hidden = false; return; }
    const orig = f.dataset.orig;
    if (!orig && data.subjects.some(s => s.code === code)){ er.textContent = "Mã môn này đã có trên trang."; er.hidden = false; return; }
    const sc = $("s-score").value.trim();
    const obj = {code, name, sem:Number($("s-sem").value)||"", credits:$("s-credits").value.trim()==="" ? "" : Number($("s-credits").value), score:sc==="" ? null : Number(sc), note:$("s-note").value.trim()};
    const i = data.subjects.findIndex(s => s.code === orig);
    if (i >= 0) data.subjects[i] = obj; else data.subjects.push(obj);
    closeDlg(); await commit((i>=0 ? "Sửa môn " : "Thêm môn ") + name, "Đã lưu môn học.");
  }
  if (f.id === "doc-form"){
    const er = $("doc-err"); const title = $("d-title").value.trim(); const linkEl = $("d-link");
    if (!title){ er.textContent = "Cần nhập tên hiển thị."; er.hidden = false; return; }
    if (linkEl && !safeUrl(linkEl.value)){ er.textContent = "Link phải bắt đầu bằng http:// hoặc https://"; er.hidden = false; return; }
    const id = f.dataset.id; let d = data.docs.find(x => x.id === id);
    if (!d){ d = {id:uid(), subject:st.code, added:new Date().toISOString()}; data.docs.push(d); }
    d.title = title; d.kind = $("d-kind").value; d.note = $("d-note").value.trim(); if (linkEl) d.link = safeUrl(linkEl.value);
    closeDlg(); await commit("Cập nhật tài liệu: " + title, "Đã lưu.");
  }
  if (f.id === "prof-form"){
    ["name","lop","truong","nganh","nienKhoa"].forEach(k => data.profile[k] = $("p-"+k).value.trim());
    data.profile.intro = $("p-intro").value.trim(); data.settings.showScores = $("p-scores").checked;
    closeDlg(); await commit("Cập nhật thông tin trang", "Đã lưu thông tin.");
  }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ st.q = e.target.value; $("list").innerHTML = homeList(st.q.trim().toLowerCase()); } });
document.addEventListener("change", e => { if (e.target.id === "file-in" && e.target.files.length){ addFiles([...e.target.files]); e.target.value = ""; } });
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop"){ e.preventDefault(); $("file-in").click(); } });
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer && e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); } });
dlg.addEventListener("cancel", () => { dlg.innerHTML = ""; });
window.addEventListener("popstate", () => { fromHash(); render(); });

/* ---------- boot ---------- */
$("main").innerHTML = `<div class="empty"><h3>Đang tải…</h3><p>Đang lấy danh sách môn học và tài liệu.</p></div>`;
loadData().then(() => { fromHash(); render(); });
})();
</script>
