<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hồ sơ Ô tô 24OT113</title>
<meta name="description" content="Hồ sơ học tập ngành Công nghệ Kỹ thuật Ô tô của Hầu Ngọc Minh Tâm – Đại học Lạc Hồng: môn học, bài báo, slide, thiết kế 3D và sản phẩm.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: info strip + header + navy nav, a dark hero with a drawn gear set, section cards overlapping the hero, then one page per section. */
:root{
  --navy:#0F1E3D; --navy-2:color-mix(in srgb,var(--navy) 90%,#fff); --navy-3:color-mix(in srgb,var(--navy) 78%,#000); --amber:#F2A413; --amber-ink:#1A1300; --amber-soft:color-mix(in srgb,var(--amber) 18%,var(--surface));
  --bg:#F6F7FA; --surface:#FFFFFF; --surface-2:#F1F3F8; --ink:#0F1E3D; --muted:#5C667C; --line:#E1E5EE;
  --good:#0E9468; --good-soft:#E2F5EE; --danger:#C62828; --danger-soft:#FCE9E9; --blue:#2457E8; --blue-soft:#E8EEFF;
  --shadow:0 1px 2px rgba(15,30,61,.06),0 8px 24px rgba(15,30,61,.08);
  --font:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif; --r:14px; --w:1160px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0A1020; --surface:#111A30; --surface-2:#18233F; --ink:#E9EDF6; --muted:#93A0BA; --line:#24304D;
  --good:#3FCB98; --good-soft:#123227; --danger:#FF6B6B; --danger-soft:#3A1A1A; --blue:#7C9EFF; --blue-soft:#1B2847;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body,button,input,select,textarea,dialog{font-family:var(--font)}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.in{max-width:var(--w);margin:0 auto;padding-inline:20px}

/* strip + header */
.strip{background:var(--navy-3);color:#C9D2E6;font-size:13px}
.strip .in{display:flex;justify-content:space-between;gap:12px;padding-block:8px;flex-wrap:wrap}
.strip b{color:#fff;font-weight:600}
.strip button{background:none;border:0;color:var(--amber);font-weight:600;cursor:pointer;padding:0;font-size:13px;text-decoration:underline}
.head{background:var(--surface);border-bottom:1px solid var(--line)}
.head .in{display:flex;align-items:center;gap:20px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:var(--navy);display:grid;place-items:center;flex:none;color:var(--amber)}
.logo svg{width:30px;height:30px}
.brand b{display:block;font-size:19px;font-weight:800;line-height:1.15;color:var(--ink)}
.brand span{font-size:12.5px;color:var(--muted)}
.infos{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.info{display:flex;gap:10px;align-items:center}
.info svg{width:22px;height:22px;color:var(--amber);flex:none}
.info b{display:block;font-size:13.5px;line-height:1.2}
.info span{font-size:12.5px;color:var(--muted)}

/* nav */
.navwrap{position:sticky;top:0;z-index:20;background:var(--navy)}
.nav{display:flex;align-items:stretch;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{appearance:none;border:0;background:none;color:#D5DCEC;font-weight:600;font-size:14px;padding:14px 16px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.nav button:hover{color:#fff}
.nav button[aria-current="page"]{color:#fff;border-bottom-color:var(--amber)}
.nav .sp{flex:1}
.nav .cta{position:sticky;right:0;background:var(--amber);color:var(--amber-ink);font-weight:700;border-bottom:0;padding-inline:20px;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.nav .cta:hover{color:var(--amber-ink);filter:brightness(1.06)}

/* hero */
.hero{position:relative;background:var(--navy-3);color:#fff;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,color-mix(in srgb,var(--navy-3) 94%,transparent) 0%,color-mix(in srgb,var(--navy-3) 78%,transparent) 45%,color-mix(in srgb,var(--navy-3) 35%,transparent) 100%)}
.hero canvas{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:min(620px,70vw);height:min(620px,70vw);z-index:-1;opacity:.9}
.hero .in{padding-block:70px 150px}
.hero .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--amber);letter-spacing:.04em;text-transform:uppercase}
.hero .eyebrow::before{content:"";width:28px;height:2px;background:var(--amber)}
.hero h1{font-size:clamp(34px,5.6vw,60px);font-weight:900;line-height:1.08;margin:14px 0 16px;letter-spacing:-.02em;max-width:16ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{max-width:54ch;color:#D5DCEC;margin:0 0 26px;font-size:16px}
.pillbtn{appearance:none;border:0;background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:14px;letter-spacing:.03em;padding:13px 26px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.pillbtn:hover{filter:brightness(1.07)}
.pillbtn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}

/* overlapping section cards */
.feat{margin-top:-96px;position:relative;z-index:2;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}
.fcard{appearance:none;border:0;background:var(--navy);color:#fff;text-align:center;padding:44px 16px 22px;position:relative;cursor:pointer;border-radius:4px 4px var(--r) var(--r);box-shadow:var(--shadow);transition:transform .18s,background .18s;margin-top:34px;min-width:0}
.fcard:hover{transform:translateY(-6px);background:var(--navy-2)}
.fcard .bump{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:76px;height:68px;background:inherit;border-radius:38px 38px 0 0;display:grid;place-items:center;padding-top:8px}
.fcard .bump svg{width:28px;height:28px;color:var(--amber)}
.fcard b{display:block;font-size:18px;font-weight:800;line-height:1.25}
.fcard span{display:block;font-size:13px;color:#C9D2E6;margin-top:6px}
.fcard i{display:inline-block;font-style:normal;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--amber-ink);background:var(--amber);padding:2px 12px;border-radius:999px}

/* sections */
.sec{padding-block:64px 8px}
.sec-title{text-align:center;margin-bottom:34px}
.sec-title h2{font-size:clamp(26px,3.6vw,36px);font-weight:800;margin:0;letter-spacing:-.015em;text-wrap:balance}
.sec-title h2::after{content:"";display:block;width:44px;height:3px;background:var(--navy);margin:14px auto 0}
@media (prefers-color-scheme:dark){.sec-title h2::after{background:var(--amber)}}
.sec-title p{color:var(--muted);max-width:60ch;margin:14px auto 0}
.band{background:linear-gradient(to bottom,transparent 55%,var(--amber) 55%);margin-top:56px;padding-bottom:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:38px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}

.page-head{background:var(--navy);color:#fff;padding-block:40px}
.page-head .crumbs{font-size:13px;color:#C9D2E6;margin-bottom:6px}
.page-head .crumbs button{background:none;border:0;color:var(--amber);cursor:pointer;padding:0;font-weight:600}
.page-head h1{font-size:clamp(28px,4vw,40px);font-weight:900;margin:0;letter-spacing:-.015em;text-wrap:balance}
.page-head p{color:#D5DCEC;margin:8px 0 0;max-width:64ch}
.page{padding-block:28px 40px}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar .field{flex:1 1 240px;width:auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:default}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0;outline:none;width:100%}
.field:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}

.sem{margin-top:28px}
.sem-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;border-left:4px solid var(--amber);padding-left:12px}
.sem-head h3{font-size:19px;font-weight:800;margin:0}
.sem-head span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.sub{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.sub:hover{transform:translateY(-3px);border-color:var(--amber)}
.sub-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sub-name{font-weight:700;line-height:1.35;font-size:15.5px}
.score{font-weight:800;font-size:17px;padding:2px 10px;border-radius:10px;background:var(--blue-soft);color:var(--blue);font-variant-numeric:tabular-nums;flex:none}
.score.top{background:var(--good-soft);color:var(--good)}
.sub-foot{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.has{background:var(--amber-soft);border-color:transparent;color:var(--ink)}

/* item cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{appearance:none;text-align:left;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;min-width:0}
.card:hover{transform:translateY(-4px);border-color:var(--amber)}
.cover{aspect-ratio:16/10;width:100%;object-fit:cover;display:block;background:var(--surface-2)}
.cover.ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--navy),var(--navy-2));color:var(--amber)}
.cover.ph svg{width:46px;height:46px;opacity:.9}
.card-b{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--amber)}
.card-b .t{font-weight:700;line-height:1.35;font-size:15.5px}
.card-b .d{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-b .m{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.cites{display:flex;flex-direction:column;gap:12px}
.cite{appearance:none;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:6px var(--r) var(--r) 6px;padding:16px 18px;cursor:pointer;box-shadow:var(--shadow);display:block;width:100%}
.cite:hover{border-color:var(--amber)}
.cite .t{font-weight:700;font-size:16px;line-height:1.4}
.cite .a{color:var(--muted);font-size:14px;margin-top:2px}
.cite .v{font-style:italic}
.cite .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* subject + docs */
.subhead{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.subhead .meta{display:flex;gap:8px;flex-wrap:wrap}
.subhead .big{margin-left:auto;text-align:center}
.subhead .big b{display:block;font-size:36px;font-weight:900;line-height:1;color:var(--good);font-variant-numeric:tabular-nums}
.subhead .big span{font-size:12px;color:var(--muted)}
.drop{margin-top:16px;border:2px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.drop b{color:var(--ink);display:block;font-size:16px;margin-bottom:2px}
.docs{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.doc{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0}
.ext{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--blue-soft);color:var(--blue)}
.ext.pdf{background:var(--danger-soft);color:var(--danger)} .ext.ppt{background:var(--amber-soft);color:var(--ink)} .ext.xls,.ext.img{background:var(--good-soft);color:var(--good)} .ext.cad{background:var(--navy);color:var(--amber)}
.doc .t{font-weight:600;overflow-wrap:anywhere}
.doc .d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.doc .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface)}
.empty h3{font-size:18px;font-weight:800;color:var(--ink);margin:0 0 4px}
.empty p{margin:0 auto 12px;max-width:52ch}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.queue{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13.5px}
.q-top{display:flex;justify-content:space-between;gap:10px}
.q-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prog{height:6px;border-radius:999px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--amber);width:0;transition:width .2s}
.q.err{border-color:var(--danger);color:var(--danger)} .q.done .prog i{background:var(--good)}

/* detail */
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
.detail .pic{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.detail .pic img{display:block;width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.spec{display:grid;grid-template-columns:110px minmax(0,1fr);font-size:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
.spec>div{padding:7px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.spec>div:nth-child(odd){background:var(--surface-2);color:var(--muted);font-size:13px}
.spec>div:nth-last-child(-n+2){border-bottom:0}
.desc{white-space:pre-wrap;margin:0 0 14px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:0;width:min(620px,calc(100% - 24px));max-height:calc(100% - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,30,.6);backdrop-filter:blur(3px)}
.dh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 8px}
.dh h3{font-size:20px;font-weight:800;margin:0;flex:1;line-height:1.25}
.x{appearance:none;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);flex:none}
.db{padding:8px 22px 16px;display:flex;flex-direction:column;gap:12px}
.df{padding:14px 22px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label.f .field{color:var(--ink);font-weight:400;font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.msg.err{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.picks{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picks img{width:110px;aspect-ratio:16/10;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.chips{display:flex;flex-direction:column;gap:6px}
.chipf{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.chipf span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3);border-left:4px solid var(--amber)}

footer{background:var(--navy-3);color:#C9D2E6;margin-top:64px;font-size:13.5px}
footer .in{padding-block:26px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer b{color:#fff}
/* admin */
.adm{display:flex;flex-direction:column;gap:18px}
.adm .panel h3{font-size:18px;font-weight:800;margin:0 0 4px}
.adm .panel>p{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.adm .stack{display:flex;flex-direction:column;gap:12px}
.secrow{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.secrow-f{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.ck{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.colors{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.colors input[type=color]{width:56px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;cursor:pointer}
.savebar{position:sticky;bottom:12px;z-index:5;background:var(--navy);color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:1000px){.infos{display:none}}
@media (max-width:760px){
  .in{padding-inline:16px}
  .hero .in{padding-block:44px 120px}
  .hero canvas{opacity:.35;right:-120px}
  .feat{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .fcard b{font-size:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail{grid-template-columns:1fr}
  .doc{grid-template-columns:40px minmax(0,1fr)}
  .doc .acts{grid-column:2;justify-content:flex-start}
  .ext{width:40px;height:40px}
  .two{grid-template-columns:1fr}
  .subhead .big{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="strip"><div class="in"><span id="strip-l"></span><span id="strip-r"></span></div></div>
<header class="head"><div class="in">
  <button class="brand" data-go="home">

const txt = (group, key, def) => { const g = site()[group] || {}; return (g[key] === undefined || g[key] === null) ? def : g[key]; };
function hexRgb(h){ const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); if (!m) return null; const n = parseInt(m[1],16); return [n>>16 & 255, n>>8 & 255, n & 255]; }
function applyTheme(){
  const th = site().theme || {}; const r = document.documentElement.style;
  if (hexRgb(th.navy)) r.setProperty("--navy", th.navy); else r.removeProperty("--navy");
  const a = hexRgb(th.accent);
  if (a){ r.setProperty("--amber", th.accent); r.setProperty("--amber-ink", (0.299*a[0] + 0.587*a[1] + 0.114*a[2]) > 150 ? "#141414" : "#FFFFFF"); } else { r.removeProperty("--amber"); r.removeProperty("--amber-ink"); }
}

let data = {profile:{}, settings:{showScores:true}, site:{}, subjects:[], docs:[], items:[]};
let dataSha = null, token = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||"").trim()) ? String(u).trim() : "";
const uid = () => "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmtSize = b => !b ? "" : b < 1048576 ? Math.max(1,Math.round(b/1024)) + " KB" : (b/1048576).toFixed(1).replace(".",",") + " MB";
const fmtScore = s => (s === null || s === undefined || s === "") ? "" : Number(s).toFixed(1).replace(".",",");
const fmtDate = d => { if (!d) return ""; const t = new Date(d); return isNaN(t) ? "" : t.toLocaleDateString("vi-VN"); };
const href = p => p.split("/").map(encodeURIComponent).join("/");
function b64utf8(str){ const bytes = new TextEncoder().encode(str); let bin = ""; for (let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); return btoa(bin); }
function utf8b64(b64){ const bin = atob(b64.replace(/\s/g,"")); const bytes = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function slugFile(name){
  const dot = name.lastIndexOf("."); const ext = dot > 0 ? name.slice(dot+1).toLowerCase().replace(/[^a-z0-9]/g,"") : "";
  const base = (dot > 0 ? name.slice(0,dot) : name).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "file";
  return base + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,4) + (ext ? "." + ext : "");
}
function extOfName(n){ const m = /\.([a-z0-9]+)$/i.exec(n || ""); return m ? m[1].toLowerCase() : ""; }
function extClass(e){ if (e==="pdf") return "pdf"; if (/^pptx?$/.test(e)) return "ppt"; if (/^(xlsx?|csv)$/.test(e)) return "xls"; if (/^(png|jpe?g|gif|webp)$/.test(e)) return "img"; if (/^(stl|step|stp|sldprt|sldasm|f3d|iges|igs|obj|3mf|dwg|dxf)$/.test(e)) return "cad"; return ""; }
let toastT;

/* ---------- GitHub API (owner only) ---------- */
async function gh(path, opts){
  const r = await fetch(API + path, Object.assign({}, opts, {headers:Object.assign({"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}, (opts&&opts.headers)||{})}));
  if (r.status === 401){ const e = new Error("Mã truy cập hết hạn hoặc không đúng."); e.code = 401; throw e; }
  if (!r.ok){ const e = new Error("GitHub trả về lỗi " + r.status); e.code = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
function normalize(){
  data.subjects = Array.isArray(data.subjects) ? data.subjects : [];
  data.docs = Array.isArray(data.docs) ? data.docs : [];
  data.items = Array.isArray(data.items) ? data.items : [];
  data.settings = data.settings || {showScores:true};
  data.profile = data.profile || {};
  data.site = (data.site && typeof data.site === "object") ? data.site : {};
  buildSecs(); applyTheme();
}
async function loadData(){
  st.error = null;
  try {
    if (token){ const j = await gh(`/contents/data.json?ref=${BRANCH}&t=${Date.now()}`); dataSha = j.sha; data = JSON.parse(utf8b64(j.content)); }
    else { const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"}); if (!r.ok) throw new Error("HTTP " + r.status); data = await r.json(); }
  } catch(e){
    if (e.code === 401){ signOut(true); return loadData(); }
    st.error = "Chưa tải được dữ liệu. Kiểm tra mạng rồi tải lại trang.";
  }
  normalize();
}
async function saveData(message){
  const body = () => JSON.stringify({message, branch:BRANCH, sha:dataSha, content:b64utf8(JSON.stringify(data, null, 1))});
  try { const j = await gh("/contents/data.json", {method:"PUT", body:body()}); dataSha = j.content.sha; }
  catch(e){
    if (e.code === 409 || e.code === 422){ const cur = await gh(`/contents/data.json?ref=${BRANCH}&t=${Date.now()}`); dataSha = cur.sha; const j = await gh("/contents/data.json", {method:"PUT", body:body()}); dataSha = j.content.sha; }
    else throw e;
  }
}
function putFile(path, base64, message, onProgress){
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("PUT", API + "/contents/" + href(path));
    x.setRequestHeader("Accept","application/vnd.github+json"); x.setRequestHeader("Authorization","Bearer "+token);
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded/e.total); };
    x.onload = () => x.status >= 200 && x.status < 300 ? res(JSON.parse(x.responseText)) : rej(Object.assign(new Error("GitHub trả về lỗi " + x.status), {code:x.status}));
    x.onerror = () => rej(new Error("Mất kết nối khi tải lên."));
    x.send(JSON.stringify({message, branch:BRANCH, content:base64}));
  });
}
async function removeFile(path, why){
  try { const f = await gh("/contents/" + href(path) + "?ref=" + BRANCH); await gh("/contents/" + href(path), {method:"DELETE", body:JSON.stringify({message:why, sha:f.sha, branch:BRANCH})}); }
  catch(e){ if (e.code !== 404) throw e; }
}
function readBase64(blob){ return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = () => rej(new Error("Không đọc được file.")); fr.readAsDataURL(blob); }); }
function compressImage(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max/Math.max(w,h)); w = Math.round(w*s); h = Math.round(h*s);
      const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,w,h); g.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(b => b ? res(b) : rej(new Error("Không nén được ảnh")), "image/jpeg", .82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Không đọc được ảnh")); };
    img.src = url;
  });
}

      <h1>${esc(txt("hero","t1","Hồ sơ học tập"))} <em>${esc(txt("hero","t2","Kỹ thuật Ô tô"))}</em></h1>
      <p>${esc(p.intro || "")}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${first && b1 ? `<button class="pillbtn" data-go="${first}">${esc(b1)}</button>` : ""}${second && b2 ? `<button class="pillbtn ghost" data-go="${second}">${esc(b2)}</button>` : ""}</div>
    </div></section>
  <div class="in"><div class="feat">${feats.map(([k,l,b,c]) => `<button class="fcard" data-go="${k}"><span class="bump">${icon(k)}</span><b>${esc(l)}</b><span>${esc(b)}</span><i>${esc(c)}</i></button>`).join("")}</div></div>
  ${st.error ? `<div class="in" style="margin-top:28px"><div class="empty"><h3>Không tải được dữ liệu</h3><p>${esc(st.error)}</p></div></div>` : ""}

    ${recent.length ? `<div class="docs" style="margin-top:0">${recent.map(r => `<div class="doc"><span class="ext ${extClass(r.ext)}">${esc(String(r.ext).slice(0,4).toUpperCase())}</span><div style="min-width:0"><div class="t">${esc(r.t)}</div><div class="d">${esc([r.kind, fmtDate(r.when)].filter(Boolean).join(" · "))}</div></div><div class="acts"><button class="btn sm navy" ${r.go}>Xem</button></div></div>`).join("")}</div>`

  </div></section>`}
  ${txt("home","showStats",true) === false ? "" : `<section class="band"><div class="in"><div class="sec-title"><h2>${esc(txt("home","statsTitle","Hồ sơ bằng con số"))}</h2></div>
    <div class="stats"><div class="stat"><b>${data.subjects.length}</b><span>Môn học</span></div><div class="stat"><b>${data.docs.length}</b><span>Tài liệu môn học</span></div><div class="stat"><b>${data.items.length}</b><span>Bài đăng ở các mục</span></div><div class="stat"><b>${nFiles}</b><span>File đính kèm</span></div></div>
  </div></section>`}`;
  drawGear();

/* gear set drawn to scale: ring 72 teeth, sun 24, three planets 24 (module shared, centre distance = m(zs+zp)/2) */
let gearRaf = 0;
function drawGear(){
  cancelAnimationFrame(gearRaf);
  const c = $("gear"); if (!c || c.hidden) return; const g = c.getContext("2d"); const W = c.width, cx = W/2, cy = W/2;
  const m = 10.5, zs = 24, zp = 24, zr = 72; const rs = m*zs/2, rp = m*zp/2, rr = m*zr/2, a = rs + rp;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ac = (hexRgb((site().theme || {}).accent) || [242,164,19]).join(",");
  function gear(x, y, r, z, rot, internal, col){
    const ad = m, de = 1.25*m; const ro = internal ? r - ad : r + ad, ri = internal ? r + de : r - de; const p = Math.PI*2/z;
    g.beginPath();
    for (let i=0;i<z;i++){ const t = rot + i*p;
      const pts = [[ri,-.25],[ro,-.11],[ro,.11],[ri,.25]];
      pts.forEach(([rad,f],k) => { const ang = t + f*p; const X = x + rad*Math.cos(ang), Y = y + rad*Math.sin(ang); (i===0&&k===0) ? g.moveTo(X,Y) : g.lineTo(X,Y); });
    }
    g.closePath(); g.strokeStyle = col; g.lineWidth = 2; g.stroke();
    if (!internal){ g.beginPath(); g.arc(x,y,r*.28,0,Math.PI*2); g.stroke(); g.beginPath(); g.arc(x,y,r*.62,0,Math.PI*2); g.globalAlpha = .35; g.stroke(); g.globalAlpha = 1; }
    else { g.beginPath(); g.arc(x,y,r+de+26,0,Math.PI*2); g.stroke(); }
  }
  function frame(ts){
    const th = reduce ? 0 : ts/9000;                 /* carrier angle, ring fixed */
    const sun = th*(1 + zr/zs), pl = th*(1 - zr/zp);
    g.clearRect(0,0,W,W);
    gear(cx,cy,rr,zr,0,true,`rgba(${ac},.55)`);
    gear(cx,cy,rs,zs,sun,false,`rgba(${ac},.95)`);
    for (let k=0;k<3;k++){ const ang = th + k*Math.PI*2/3; const x = cx + a*Math.cos(ang), y = cy + a*Math.sin(ang);
      gear(x,y,rp,zp,pl + Math.PI/zp,false,"rgba(255,255,255,.75)"); }
    g.beginPath(); for (let k=0;k<3;k++){ const ang = th + k*Math.PI*2/3; const x = cx + a*Math.cos(ang), y = cy + a*Math.sin(ang); k ? g.lineTo(x,y) : g.moveTo(x,y); } g.closePath(); g.strokeStyle = "rgba(255,255,255,.25)"; g.lineWidth = 1.5; g.stroke();
    if (!reduce && $("gear")) gearRaf = requestAnimationFrame(frame);
  }
  gearRaf = requestAnimationFrame(frame);
}

function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1)); st.code = st.id = st.sec = null; st.view = "home";

}

/* ---------- subject uploads ---------- */
let uploading = false;
async function addFiles(files){
  if (!token || !st.code) return; const code = st.code;
  for (const f of files){
    if (f.size > MAX_FILE){ st.queue.push({name:f.name, p:0, state:"err", msg:"Quá 40 MB – hãy để trên Drive rồi thêm link"}); continue; }
    if (f.size === 0){ st.queue.push({name:f.name, p:0, state:"err", msg:"File rỗng"}); continue; }
    st.queue.push({name:f.name, p:0, state:"wait", file:f, code});
  }
  renderQueue(); if (uploading) return; uploading = true; let added = 0;
  try {
    for (const q of st.queue){
      if (q.state !== "wait") continue; q.state = "up"; renderQueue();
      try {
        const b64 = await readBase64(q.file); const path = "files/" + q.code + "/" + slugFile(q.file.name);
        await putFile(path, b64, "Thêm tài liệu: " + q.file.name, p => { q.p = p * .95; renderQueue(); });
        data.docs.push({id:uid(), subject:q.code, title:q.file.name.replace(/\.[^.]+$/,""), kind:"", note:"", path, name:q.file.name, size:q.file.size, added:new Date().toISOString()});
        q.p = 1; q.state = "done"; q.file = null; added++;
      } catch(e){ q.state = "err"; q.file = null; q.msg = e.code === 401 ? "Cần đăng nhập lại" : e.code === 403 ? "Mã truy cập thiếu quyền ghi" : (e.message || "Lỗi tải lên"); if (e.code === 401){ signOut(true); break; } }
      renderQueue();
    }
    if (added){ await saveData("Cập nhật danh sách tài liệu (+" + added + ")"); toast("Đã tải lên " + added + " file."); }
  } catch(e){ toast("Tải file xong nhưng chưa ghi được danh sách. Tải lại trang rồi thử lại."); }
  uploading = false; st.queue = st.queue.filter(q => q.state === "err"); render();
}

async function doLogin(){
  const v = $("tok").value.trim(); const err = $("login-err"); err.hidden = true; if (!v){ $("tok").focus(); return; }
  $("login-go").disabled = true; $("login-go").textContent = "Đang kiểm tra…";
  try {
    const r = await fetch(API, {headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer " + v}});
    if (r.status === 401) throw new Error("Mã truy cập không đúng hoặc đã hết hạn.");
    if (!r.ok) throw new Error("Mã này không truy cập được kho của trang (lỗi " + r.status + ").");
    const j = await r.json(); if (!j.permissions || !j.permissions.push) throw new Error("Mã này chưa có quyền ghi (Contents: Read and write) vào kho của trang.");
    token = v; try { localStorage.setItem(TOKEN_KEY, v); } catch(e){}
    closeDlg(); await loadData(); fromHash(); render(); toast("Đã đăng nhập. Bạn có thể thêm nội dung.");

}

async function uploadDraft(dir, busy){

document.addEventListener("click", async e => {

    case "del-item": {

      data.site = {
        hero:{eyebrow:$("h-eyebrow").value.trim(), t1:$("h-t1").value.trim(), t2:$("h-t2").value.trim(), b1:$("h-b1").value.trim(), b2:$("h-b2").value.trim(), gear:$("h-gear").checked},
        home:{recentTitle:$("o-recentTitle").value.trim(), recentSub:$("o-recentSub").value.trim(), statsTitle:$("o-statsTitle").value.trim(), showRecent:$("o-showRecent").checked, showStats:$("o-showStats").checked},
        sections:secs, footer:$("s-footer").value.trim(),
        theme:{navy:navy.toUpperCase() === "#0F1E3D" ? "" : navy, accent:accent.toUpperCase() === "#F2A413" ? "" : accent}
      };
      const olds = up.olds; buildSecs(); applyTheme();
      if (await commit("Cập nhật nội dung trang", "Đã lưu. Người xem bên ngoài sẽ thấy sau khoảng 1 phút.")){ for (const pth of olds){ try { await removeFile(pth, "Dọn ảnh cũ"); } catch(_){} } }
    } catch(err){ $("save-go").disabled = false; busy(err.code === 401 ? "Phiên đăng nhập hết hạn. Hãy đăng nhập lại." : "Chưa lưu được. Kiểm tra mạng rồi thử lại."); }
  }
});
document.addEventListener("input", e => { if (e.target.id === "q"){ st.q = e.target.value; const q = st.q.trim().toLowerCase(); $("list").innerHTML = st.view === "subjects" ? subjectList(q) : itemList(st.sec, q); } });
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "file-in" && t.files.length){ addFiles([...t.files]); t.value = ""; }
  if (t.id === "cover-in" && t.files[0] && draft){ try { const blob = await compressImage(t.files[0], 1600); draft.newCover = {blob, url:URL.createObjectURL(blob)}; drawCoverBox(); } catch(err){ toast("Không đọc được ảnh này. Thử ảnh JPG hoặc PNG khác."); } }
  if (t.id === "item-files" && t.files.length && draft){ for (const f of t.files){ if (f.size > MAX_FILE) toast("“" + f.name + "” quá 40 MB – hãy để trên Drive rồi dán link."); else if (f.size > 0) draft.newFiles.push(f); } drawFileBox(); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.id === "drop"){ e.preventDefault(); $("file-in").click(); } });
["dragenter","dragover"].forEach(ev => document.addEventListener(ev, e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest("#drop"); if (d && !d.contains(e.relatedTarget)) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest("#drop"); if (d){ e.preventDefault(); d.classList.remove("over"); if (e.dataTransfer && e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); } });
dlg.addEventListener("cancel", () => { dlg.innerHTML = ""; if (st.view !== "admin") draft = null; });
window.addEventListener("popstate", () => { fromHash(); render(); });


$("main").innerHTML = `<div class="in page"><div class="empty"><h3>Đang tải…</h3><p>Đang lấy nội dung hồ sơ.</p></div></div>`;
loadData().then(() => { fromHash(); render(); });
})();
</script>
</body>
</html>
